# Opt-in wasm core spike CI — does NOT run on Release and does not modify
# production core/. Enable via workflow_dispatch, wasm-core/** branches, or
# PRs touching wasm patches / wrapper. See docs/research/wasm-patches/README.md.
name: wasm-core (opt-in)

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run alice→bob networking e2e (ws-tcp-proxy → nine.testrun.org; creates 2 throwaway accounts)'
        type: boolean
        default: false
  push:
    branches:
      - 'wasm-core/**'
    paths:
      - 'docs/research/wasm-patches/**'
      - 'tools/apply-wasm-core-patches.py'
      - 'packages/deltachat-wasm/**'
      - 'scripts/smoke-deltachat-wasm.mjs'
      - 'scripts/e2e-deltachat-wasm-network.mjs'
      - 'scripts/e2e-deltachat-wasm-identity.mjs'
      - '.github/workflows/wasm-core-opt-in.yml'
  pull_request:
    paths:
      - 'docs/research/wasm-patches/**'
      - 'tools/apply-wasm-core-patches.py'
      - 'packages/deltachat-wasm/**'
      - 'scripts/smoke-deltachat-wasm.mjs'
      - 'scripts/e2e-deltachat-wasm-network.mjs'
      - 'scripts/e2e-deltachat-wasm-identity.mjs'
      - '.github/workflows/wasm-core-opt-in.yml'

concurrency:
  group: wasm-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-on-copy-pack-smoke:
    runs-on: ubuntu-latest
    # Informational for the spike — must not block Release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang pkg-config libssl-dev make brotli

      - name: Install Rust (nightly pin for wasm cfg_select)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          targets: wasm32-unknown-unknown

      # Day 9: apply-on-copy installs the pinned locks from
      # docs/research/wasm-patches/support/locks/ (refuses if stale vs master
      # core/Cargo.lock or the series). All cargo steps below use --locked.
      - name: Apply wasm patches onto a copy (never master core/) + pinned locks
        run: |
          python3 tools/apply-wasm-core-patches.py lock-status
          python3 tools/apply-wasm-core-patches.py apply-on-copy --dest "$RUNNER_TEMP/velta-wasm-copy"
          python3 tools/apply-wasm-core-patches.py verify-copy --dest "$RUNNER_TEMP/velta-wasm-copy"
          test -d "$RUNNER_TEMP/velta-wasm-copy/packages/deltachat-wasm"
          git diff --exit-code -- core/
          WBG=$(sed -n 's/^wasm_bindgen_version=//p' docs/research/wasm-patches/support/locks/PROVENANCE)
          echo "WASM_BINDGEN_VERSION=$WBG" >> "$GITHUB_ENV"
          echo "pinned wasm-bindgen: $WBG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: cargo check wasm lib
        working-directory: ${{ runner.temp }}/velta-wasm-copy/core
        env:
          CC: clang
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo check --locked -p deltachat --lib --target wasm32-unknown-unknown --no-default-features

      - name: Install wasm-pack + matched wasm-bindgen-cli
        run: |
          cargo install wasm-pack --locked
          # bindgen CLI must equal the wasm-bindgen crate in the pinned lock
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      - name: wasm-pack build (MPL wrapper)
        working-directory: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm/rust
        env:
          CC: clang
          CARGO_BUILD_JOBS: "2"
        run: |
          wasm-pack build --target web --release --no-opt --out-dir ../wasm-dist -- --locked
          git -C "$GITHUB_WORKSPACE" diff --no-index --exit-code \
            docs/research/wasm-patches/support/locks/deltachat-wasm.Cargo.lock "$PWD/Cargo.lock"
          ls -lh ../wasm-dist/deltachat_wasm_bg.wasm

      # Day 14a: publish the no-opt artifact so the C2 worker rig can test the
      # exact bits CI smoked (local wasm builds lack clang on the dev box).
      - name: Upload wasm-dist (no-opt artifact)
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist-no-opt
          path: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm/wasm-dist/
          if-no-files-found: error

      - name: Browser smoke (get_system_info)
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm
        working-directory: ${{ github.workspace }}/scripts
        run: |
          npm install --no-fund --no-audit playwright@1.56.0
          npx playwright install --with-deps chromium
          node smoke-deltachat-wasm.mjs

      # Size step (Day 8): binaryen pinned to version_120 (matches local
      # measurement 29.9 MB → 18.5 MB). Informational; smoke re-runs on the
      # optimized artifact so a broken wasm-opt output is caught.
      - name: wasm-opt -Os (binaryen 120)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm/wasm-dist
        run: |
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_120/binaryen-version_120-x86_64-linux.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          WASM_OPT="$RUNNER_TEMP/binaryen-version_120/bin/wasm-opt"
          "$WASM_OPT" --version
          before=$(stat -c %s deltachat_wasm_bg.wasm)
          "$WASM_OPT" -Os \
            --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext \
            --enable-mutable-globals --enable-reference-types --enable-multivalue \
            deltachat_wasm_bg.wasm -o deltachat_wasm_bg.opt.wasm
          mv deltachat_wasm_bg.opt.wasm deltachat_wasm_bg.wasm
          after=$(stat -c %s deltachat_wasm_bg.wasm)
          echo "wasm-opt: $before -> $after bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # Day 10 size budget (proposal, see docs/research/wasm-core-landing-checklist.md §4):
      # Day-9 baseline 18 524 339 raw / 4 636 997 brotli-11 / 7 201 173 gzip-9.
      # Step fails above budget; job stays informational (continue-on-error).
      - name: Size budget (wasm-opt artifact)
        continue-on-error: true
        working-directory: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm/wasm-dist
        env:
          BUDGET_RAW: "20000000"
          BUDGET_BROTLI: "5000000"
          BUDGET_GZIP: "7800000"
        run: |
          raw=$(stat -c %s deltachat_wasm_bg.wasm)
          br=$(brotli -q 11 -c deltachat_wasm_bg.wasm | wc -c)
          gz=$(gzip -9 -c deltachat_wasm_bg.wasm | wc -c)
          {
            echo "| wasm-opt artifact | bytes | budget |"
            echo "|---|---|---|"
            echo "| raw | $raw | $BUDGET_RAW |"
            echo "| brotli -q 11 | $br | $BUDGET_BROTLI |"
            echo "| gzip -9 | $gz | $BUDGET_GZIP |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          fail=0
          [ "$raw" -le "$BUDGET_RAW" ] || { echo "::error::raw $raw > $BUDGET_RAW"; fail=1; }
          [ "$br" -le "$BUDGET_BROTLI" ] || { echo "::error::brotli $br > $BUDGET_BROTLI"; fail=1; }
          [ "$gz" -le "$BUDGET_GZIP" ] || { echo "::error::gzip $gz > $BUDGET_GZIP"; fail=1; }
          exit $fail

      - name: Browser smoke on wasm-opt artifact
        continue-on-error: true
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm
        working-directory: ${{ github.workspace }}/scripts
        run: node smoke-deltachat-wasm.mjs

      # Day 10: optional networking e2e — manual dispatch only (never on push /
      # PR): it creates two throwaway accounts on the public test relay.
      # Proxy = Unlicense ws-tcp-proxy pinned by commit, fetched at run time
      # (not vendored), restricted with CHATMAIL_ALLOWLIST. Uses the wasm-opt
      # artifact (ship path). No relay changes.
      - name: Fetch ws-tcp-proxy (pinned, Unlicense)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
        continue-on-error: true
        env:
          PROXY_REPO: https://github.com/experintellia/slothfulchat-web.git
          PROXY_SHA: 452cd0d24a26d4927faf2b949f18af4cabffb87f
        run: |
          d="$RUNNER_TEMP/ws-tcp-proxy-src"
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 "$PROXY_REPO" "$PROXY_SHA"
          git -C "$d" checkout -q FETCH_HEAD -- packages/ws-tcp-proxy
          cd "$d/packages/ws-tcp-proxy"
          # upstream ships no package-lock.json for this package: pin its
          # single runtime dep (ws) exactly instead of `npm ci`
          npm install --no-fund --no-audit --no-save --no-package-lock ws@8.22.0
          node -e "require.resolve('ws')"
          echo "WS_TCP_PROXY=$PWD/ws-tcp-proxy.mjs" >> "$GITHUB_ENV"

      - name: Networking e2e alice→bob (wasm-opt artifact)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm
          CHATMAIL_NEW: https://nine.testrun.org/new
          CHATMAIL_ALLOWLIST: nine.testrun.org
        working-directory: ${{ github.workspace }}/scripts
        run: |
          node e2e-deltachat-wasm-network.mjs 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -E '^OK: two accounts|^  wasm-roundtrip-|^elapsed' "$RUNNER_TEMP/e2e.log" >> "$GITHUB_STEP_SUMMARY" || true

      # Day 17: V2.5 identity round-trip (export_self_keys → fresh account →
      # import_self_keys → configure re-login). Non-blocking until first
      # green in CI; the dev box cannot reach chatmail relays (VPN).
      - name: Identity e2e (V2.5 round-trip)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/velta-wasm-copy/packages/deltachat-wasm
          CHATMAIL_NEW: https://nine.testrun.org/new
          CHATMAIL_ALLOWLIST: nine.testrun.org
        working-directory: ${{ github.workspace }}/scripts
        run: node e2e-deltachat-wasm-identity.mjs
