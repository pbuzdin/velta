# Opt-in wasm core spike CI — does NOT run on Release and does not modify
# production core/. Enable by pushing to a branch matching wasm-core/** or via
# workflow_dispatch. See docs/research/wasm-patches/README.md.
name: wasm-core (opt-in)

on:
  workflow_dispatch:
  push:
    branches:
      - 'wasm-core/**'
    paths:
      - 'docs/research/wasm-patches/**'
      - 'tools/apply-wasm-core-patches.py'
      - '.github/workflows/wasm-core-opt-in.yml'
  pull_request:
    paths:
      - 'docs/research/wasm-patches/**'
      - 'tools/apply-wasm-core-patches.py'
      - '.github/workflows/wasm-core-opt-in.yml'

concurrency:
  group: wasm-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-on-copy-and-check:
    runs-on: ubuntu-latest
    # Keep this job from blocking release; it is informational for the spike.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang pkg-config libssl-dev make

      - name: Install Rust (nightly pin for wasm cfg_select)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          targets: wasm32-unknown-unknown

      - name: Apply wasm patches onto a copy (never master core/)
        run: |
          python3 tools/apply-wasm-core-patches.py apply-on-copy --dest "$RUNNER_TEMP/velta-wasm-copy"
          python3 tools/apply-wasm-core-patches.py verify-copy --dest "$RUNNER_TEMP/velta-wasm-copy"

      - name: cargo check wasm lib
        working-directory: ${{ runner.temp }}/velta-wasm-copy/core
        env:
          CC: clang
          CARGO_BUILD_JOBS: "2"
        run: |
          mkdir -p .cargo
          # getrandom wasm_js cfg (also present after patches if .cargo/config.toml applied)
          if [ ! -f .cargo/config.toml ]; then
            printf '%s\n' '[target.wasm32-unknown-unknown]' 'rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]' > .cargo/config.toml
          fi
          cargo check -p deltachat --lib --target wasm32-unknown-unknown --no-default-features

      # Full wasm-pack + Playwright smoke needs the MPL wrapper package (still
      # side-tree only). Documented for Day 7+; this job stops at cargo check.
      - name: Smoke placeholder
        run: |
          echo "wasm-pack + get_system_info smoke still lives in the side tree"
          echo "(/workspace/velta-wasm-port/packages/core-wasm). Wire when wrapper is in-repo."
