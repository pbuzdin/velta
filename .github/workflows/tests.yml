# Full JS suite on every PR and master push (#195). Includes the #178
# DEK-wrap layout pin (tests/android-dek-wrap-layout.test.mjs) so a merge
# cannot reintroduce ByteArray(1 + iv.size + dek.size).
name: tests

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript-and-browser:
    runs-on: ubuntu-24.04  # Playwright has no chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # ws-proxy-auth.test.mjs skips without websockets; pwa-onboarding.test.mjs
      # cross-checks Veltar's Ed25519 signer through cryptography.
      - name: Python test dependencies
        run: python3 -m pip install --user --break-system-packages 'websockets==13.1' 'cryptography==43.0.3'
      # Quoted glob: Node 24 treats a `tests/` directory argument as one
      # file and fails with MODULE_NOT_FOUND. Node expands ** itself.
      - name: JavaScript tests
        run: node --test 'tests/**/*.test.mjs'
      - name: Install browser test dependency
        working-directory: scripts
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx --prefix scripts playwright install --with-deps chromium
      - name: Main UI browser smoke
        run: node scripts/e2e-smoke.mjs
