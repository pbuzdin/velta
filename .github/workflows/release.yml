name: Release

# Builds the Android APK and the Windows NSIS installer and publishes them
# as a GitHub release named after the version in tauri.conf.json. Triggered
# by a v* tag push or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version velta-app/src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # On a tag push use the pushed tag; on a manual dispatch create v<version>.
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ steps.ver.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog since the previous tag
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "Range: $PREV..$TAG"
            {
              echo "## What's changed since $PREV"
              echo
              echo "Full changelog: https://github.com/pbuzdin/velta/compare/$PREV...$TAG"
              echo
              git log --no-merges --format='- %s (%h)' "$PREV..$TAG"
            } > changelog.md
          else
            echo "No previous tag — listing everything up to $TAG"
            {
              echo "## What's changed in $TAG"
              echo
              git log --no-merges --format='- %s (%h)' "$TAG"
            } > changelog.md
          fi
          cat changelog.md

      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: velta-android
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: velta-windows
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets

      # Manifest for tauri-plugin-updater (Windows self-update). Must be the
      # LAST asset uploaded: it lives at releases/latest/download/latest.json
      # and points at the installer in this same release — a manifest visible
      # before its installer bricks the update for one cycle.
      - name: Write latest.json updater manifest
        run: |
          SIG=$(find release-assets -name "*_x64-setup.exe.sig" | head -1)
          test -n "$SIG" || { echo "no updater .sig found"; exit 1; }
          EXE="https://github.com/pbuzdin/velta/releases/download/v${{ steps.ver.outputs.version }}/Velta_${{ steps.ver.outputs.version }}_x64-setup.exe"
          jq -n --arg ver "${{ steps.ver.outputs.version }}"                 --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"                 --arg sig "$(cat "$SIG")"                 --arg url "$EXE"             '{version: $ver, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}'             > release-assets/latest.json
          cat release-assets/latest.json

      # The apps fetch releases/latest/download/version.txt for the update
      # banner (ui.js checkForUpdate) — keep the file to the bare version.
      - name: Write version.txt asset
        run: echo "${{ steps.ver.outputs.version }}" > release-assets/version.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Velta v${{ steps.ver.outputs.version }}
          body_path: changelog.md
          files: |
            release-assets/*.apk
            release-assets/version.txt
            release-assets/**/Velta_*_x64-setup.exe
            release-assets/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: [android, windows, release]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tagged commit
        id: tag
        run: |
          TAG="v${{ needs.release.outputs.version }}"
          git clone --quiet --depth 1 --branch "$TAG" https://github.com/pbuzdin/velta.git repo
          cd repo
          {
            echo "msg<<MSG_EOF"
            git log -1 --format=%B "$TAG"
            echo "MSG_EOF"
            echo "sha=$(git rev-parse "$TAG^{commit}")"
          } >> "$GITHUB_OUTPUT"

      - name: Send notification
        run: |
          curl \
            -H "Title: Velta: version bumped to ${{ needs.release.outputs.version }}" \
            -H "Tags: Velta,robot" \
            -d "${{ steps.tag.outputs.msg }}
          Link: https://github.com/pbuzdin/velta/commit/${{ steps.tag.outputs.sha }}" \
            https://ntfy.gluek.info/velta_changelog
