name: Release

# Builds the Android APK and the Windows NSIS installer and publishes them
# as a GitHub release named after the version in Cargo.toml. Triggered
# by a v* tag push or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  release:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -m1 '^version' velta-app/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # On a tag push use the pushed tag; on a manual dispatch create v<version>.
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ steps.ver.outputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog since the previous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Previous tag WITH a published release: a tag whose run failed
          # (v1.4.66) never shipped, so its changes belong in the next notes.
          PREV=""
          for t in $(git tag --merged "$TAG^" --sort=-v:refname 'v*'); do
            if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              PREV="$t"
              break
            fi
          done
          [ -n "$PREV" ] || PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          # Release-notes entries: user-facing conventional commits only —
          # chore/docs/ci/test/style/build are skipped. Each entry renders as
          # "- type(scope): \n<subject> (<short-sha>)" with a blank line
          # after, per the announce format.
          list_commits() {
            git log --no-merges --format='%h%x09%s' "$@" | awk -F'\t' '
              $2 !~ /^(feat|fix|perf|refactor|revert)(\([^)]*\))?:[ ]/ { next }
              {
                type = $2; sub(/:.*/, "", type)
                sub(/^[^:]+:[ ]*/, "", $2)
                printf "- %s: \n%s (%s)\n\n", type, $2, $1
              }'
          }
          # Optional hand-written notes for this tag (highlights, thanks):
          # .github/release-notes/<tag>.md is printed above the commit list.
          extra_notes() {
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then cat "$NOTES"; echo; fi
          }
          if [ -n "$PREV" ]; then
            echo "Range: $PREV..$TAG"
            {
              echo "## What's changed in Velta $TAG"
              echo
              echo "Full changelog: https://github.com/pbuzdin/velta/compare/$PREV...$TAG"
              echo
              extra_notes
              list_commits "$PREV..$TAG"
            } > changelog.md
            {
              echo "What's changed in Velta $TAG"
              echo
              extra_notes
              list_commits "$PREV..$TAG"
              echo "Download: https://github.com/pbuzdin/velta/releases/tag/$TAG"
            } > announce.md
          else
            echo "No previous tag — listing everything up to $TAG"
            {
              echo "## What's changed in Velta $TAG"
              echo
              extra_notes
              list_commits "$TAG"
            } > changelog.md
            {
              echo "What's changed in Velta $TAG"
              echo
              extra_notes
              list_commits "$TAG"
              echo "Download: https://github.com/pbuzdin/velta/releases/tag/$TAG"
            } > announce.md
          fi
          cat changelog.md

      - name: Download Android APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-android
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-windows
          path: release-assets

      - name: Download macOS app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-macos
          path: release-assets

      - name: List release assets
        run: ls -lh release-assets

      # The macOS build is ad-hoc signed (no Apple Developer ID yet), so
      # Gatekeeper blocks the first launch — the release page says how to
      # clear it (same text as README "macOS").
      - name: Append macOS install notes to the changelog
        run: |
          cat >> changelog.md <<'NOTES'

          ## macOS (test build)

          `Velta_<version>_universal.dmg` runs on Apple Silicon and Intel Macs (macOS 10.15+). It is **not notarized** (no Apple Developer ID yet), so macOS blocks the first launch:

          1. Open the DMG and drag **Velta** into **Applications**.
          2. Remove the download quarantine once, in Terminal:
             `xattr -dr com.apple.quarantine /Applications/Velta.app`
             — or try to open Velta, then go to **System Settings → Privacy & Security** and click **Open Anyway** (macOS 15 no longer offers right-click → Open for this).
          3. macOS asks for microphone/camera access on first use (calls, QR scanning). With the ad-hoc signature it may ask again after an update.
          NOTES

      # Manifest for tauri-plugin-updater (Windows + macOS self-update). Must be the
      # LAST asset uploaded: it lives at releases/latest/download/latest.json
      # and points at the installer in this same release — a manifest visible
      # before its installer bricks the update for one cycle.
      - name: Write latest.json updater manifest
        run: |
          VER="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/pbuzdin/velta/releases/download/v$VER"
          SIG=$(find release-assets -name "*_x64-setup.exe.sig" | head -1)
          test -n "$SIG" || { echo "no Windows updater .sig found"; exit 1; }
          MAC_SIG=$(find release-assets -name "Velta_*_universal.app.tar.gz.sig" | head -1)
          test -n "$MAC_SIG" || { echo "no macOS updater .sig found"; exit 1; }
          # One universal tarball serves both darwin architectures.
          jq -n --arg ver "$VER" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig "$(cat "$SIG")" \
                --arg url "$BASE/Velta_${VER}_x64-setup.exe" \
                --arg macsig "$(cat "$MAC_SIG")" \
                --arg macurl "$BASE/Velta_${VER}_universal.app.tar.gz" \
            '{version: $ver, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $sig, url: $url},
                "darwin-aarch64": {signature: $macsig, url: $macurl},
                "darwin-x86_64": {signature: $macsig, url: $macurl}}}' \
            > release-assets/latest.json
          cat release-assets/latest.json

      # The apps fetch releases/latest/download/version.txt for the update
      # banner (ui.js checkForUpdate) — keep the file to the bare version.
      - name: Write version.txt asset
        run: echo "${{ steps.ver.outputs.version }}" > release-assets/version.txt

      # The ntfy announce rides the same text as the release notes, minus the
      # compare link and install notes — uploaded as an artifact so the notify
      # job needs no repo checkout or git history.
      - name: Upload announcement text
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-announce
          path: announce.md

      # Version-less copies for "latest" download links (README, velta.cc):
      # releases/latest/download/Velta-<os>-<arch>.<ext>. Plain copies — the
      # updater keeps using the versioned installers + latest.json + .sig.
      - name: Stable-named copies for latest/download links
        run: |
          set -e
          mkdir -p release-assets/stable
          cp "$(find release-assets -maxdepth 1 -name 'Velta-*-arm64.apk' | head -1)" release-assets/stable/Velta-android-arm64.apk
          cp "$(find release-assets -path release-assets/stable -prune -o -name 'Velta_*_universal.dmg' -print | head -1)" release-assets/stable/Velta-macos-universal.dmg
          cp "$(find release-assets -path release-assets/stable -prune -o -name 'Velta_*_x64-setup.exe' -print | head -1)" release-assets/stable/Velta-windows-x64-setup.exe
          ls -l release-assets/stable

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Velta v${{ steps.ver.outputs.version }}
          body_path: changelog.md
          files: |
            release-assets/*.apk
            release-assets/version.txt
            release-assets/**/Velta_*_x64-setup.exe
            release-assets/**/*_x64-setup.exe.sig
            release-assets/**/Velta_*_universal.dmg
            release-assets/**/Velta_*_universal.app.tar.gz
            release-assets/**/Velta_*_universal.app.tar.gz.sig
            release-assets/stable/Velta-android-arm64.apk
            release-assets/stable/Velta-macos-universal.dmg
            release-assets/stable/Velta-windows-x64-setup.exe
            release-assets/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # velta.cc shows "Latest release: vX.Y.Z": copy this release's version.txt
  # to the website branch and rewrite the static fallback text in index.html
  # ([data-latest-version]). Normal commit; retried on a race with pwa-web.
  website-version:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website
      - name: Commit version.txt + Latest release text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | sed 's/^v//')
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' || { echo "bad version: $VER"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin website && git reset -q --hard origin/website
            printf '%s\n' "$VER" > version.txt
            sed -i -E "s#(data-latest-version>)v[^<]*<#\1v$VER<#" index.html
            git add version.txt index.html
            git diff --cached --quiet && { echo "already $VER"; exit 0; }
            git commit -q -m "web: latest release v$VER (version.txt)"
            git push -q origin HEAD:website && exit 0
            sleep 5
          done
          exit 1

  notify:
    needs: [android, windows, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download announcement text
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-announce
          path: announce

      # The notes go through a file, never through ${{ }} inside the
      # script: quotes/backticks/$( ) in commit subjects would otherwise be
      # parsed by the shell (breaking the step or running as commands).
      - name: Send notification
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          curl \
            -H "Title: What's changed in Velta v$VERSION" \
            -H "Tags: Velta,robot" \
            --data-binary @announce/announce.md \
            https://ntfy.gluek.info/velta_changelog
