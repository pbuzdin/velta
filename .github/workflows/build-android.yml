name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'delta-web-app/**'
      - 'delta-core-service/**'
      - 'deltachat-backend/**'
      - 'core/**'
      - '.github/workflows/build-*.yml'
    tags: ["v*"]
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'delta-web-app/**'
      - 'delta-core-service/**'
      - 'deltachat-backend/**'
      - 'core/**'
      - '.github/workflows/build-*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: "ndk;27.2.12479018 platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Configure cargo for Android
        run: |
          mkdir -p ~/.cargo
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK/bin/aarch64-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=aarch64-linux-android24"]

          [target.armv7-linux-androideabi]
          linker = "$NDK/bin/armv7a-linux-androideabi24-clang"
          rustflags = ["-C", "link-arg=--target=armv7a-linux-androideabi24"]

          [target.i686-linux-android]
          linker = "$NDK/bin/i686-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=i686-linux-android24"]

          [target.x86_64-linux-android]
          linker = "$NDK/bin/x86_64-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=x86_64-linux-android24"]
          EOF

      - name: Build Android APK (arm64-v8a)
        working-directory: ./delta-web-app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$NDK/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK/bin/llvm-ranlib"
          cargo tauri android build --apk --target aarch64

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            # Persistent release key: every build signs with the SAME key, so
            # APKs upgrade in place. Create it once locally:
            #   keytool -genkey -v -keystore velta-release.keystore -alias velta \
            #     -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Velta"
            #   base64 -w0 velta-release.keystore   -> repo secret ANDROID_KEYSTORE_B64
            # plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD.
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > signing/velta-release.keystore
            echo "KS=signing/velta-release.keystore" >> "$GITHUB_ENV"
          else
            # No secret configured (forks/PRs): ephemeral key so the build still
            # produces an installable APK. Different runs cannot update each
            # other in place — do not publish these as releases.
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — using an ephemeral key; APKs from different runs will NOT be upgrade-compatible"
            keytool -genkey -v -keystore signing/velta-release.keystore -alias velta -keyalg RSA -keysize 2048 -validity 10000 -storepass velta123 -keypass velta123 -dname "CN=Velta"
            echo "KS=signing/velta-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE: ${{ env.KS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'velta123' }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'velta' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'velta123' }}
        run: |
          UNSIGNED=$(find delta-web-app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then echo "Unsigned APK not found"; exit 1; fi
          echo "Signing $UNSIGNED"

          ALIGNED="${UNSIGNED%.apk}-zipaligned.apk"
          SIGNED="${UNSIGNED%.apk}-signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --ks-key-alias "$ALIAS" --key-pass pass:"$KEY_PASS" --out "$SIGNED" "$ALIGNED"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velta-android
          path: |
            delta-web-app/src-tauri/gen/android/app/build/outputs/apk/*/release/*-signed.apk
            delta-web-app/src-tauri/gen/android/app/build/outputs/apk/*/release/*-unsigned.apk

      - name: Upload release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: delta-web-app/src-tauri/gen/android/app/build/outputs/apk/*/release/*-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
