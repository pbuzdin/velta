name: Build Android APK

on:
  workflow_call:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # The generated Gradle rustBuild task shells out to `cargo tauri`, so
      # the CARGO tauri-cli must be on PATH (the npm CLI can't serve it).
      # Cache the installed binary: the ~4-minute source compile runs only
      # when the cache key changes.
      - name: Cache cargo tauri-cli
        uses: actions/cache@v4
        id: taurocli
        with:
          path: ~/.cargo/bin
          key: tauri-cli-linux-v2

      # Belt and suspenders: keyed off the binary, not the cache flag — a
      # "successful" restore that later loses the binary must still reinstall.
      - name: Install cargo tauri-cli
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            echo "cargo-tauri already installed: $(cargo-tauri --version)"
          else
            cargo install tauri-cli --version "^2.0" --locked
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: "ndk;27.2.12479018 platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Configure cargo for Android
        run: |
          mkdir -p ~/.cargo
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK/bin/aarch64-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=aarch64-linux-android24"]

          [target.armv7-linux-androideabi]
          linker = "$NDK/bin/armv7a-linux-androideabi24-clang"
          rustflags = ["-C", "link-arg=--target=armv7a-linux-androideabi24"]

          [target.i686-linux-android]
          linker = "$NDK/bin/i686-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=i686-linux-android24"]

          [target.x86_64-linux-android]
          linker = "$NDK/bin/x86_64-linux-android24-clang"
          rustflags = ["-C", "link-arg=--target=x86_64-linux-android24"]
          EOF

      # Caches the cargo registry and the aarch64 target dir; mirrors the
      # Windows workflow (one rust-cache per job — a second one would
      # overwrite the restored ~/.cargo state and defeat the cache).
      # cache-bin:false — rust-cache otherwise manages ~/.cargo/bin itself
      # and WIPES it when its key changes (it changed with the 1.4.10
      # version bump), deleting the cargo-tauri binary restored above.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./velta-app/src-tauri
          cache-bin: false

      - name: Build Android APK (arm64-v8a)
        working-directory: ./velta-app
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$NDK/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK/bin/llvm-ranlib"
          cargo tauri android build --apk --target aarch64

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          mkdir -p signing
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            # Persistent release key: every build signs with the SAME key, so
            # APKs upgrade in place. Create it once locally:
            #   keytool -genkey -v -keystore velta-release.keystore -alias velta \
            #     -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Velta"
            #   base64 -w0 velta-release.keystore   -> repo secret ANDROID_KEYSTORE_B64
            # plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD.
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > signing/velta-release.keystore
            echo "KS=signing/velta-release.keystore" >> "$GITHUB_ENV"
          else
            # No secret configured (forks/PRs): ephemeral key so the build still
            # produces an installable APK. Different runs cannot update each
            # other in place — do not publish these as releases.
            # A tag build IS a release: fail instead of publishing an APK that
            # cannot update existing installs.
            if [ "$REF_TYPE" = "tag" ]; then
              echo "::error::ANDROID_KEYSTORE_B64 secret not set — refusing to sign a release with an ephemeral key"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set — using an ephemeral key; APKs from different runs will NOT be upgrade-compatible"
            keytool -genkey -v -keystore signing/velta-release.keystore -alias velta -keyalg RSA -keysize 2048 -validity 10000 -storepass velta123 -keypass velta123 -dname "CN=Velta"
            echo "KS=signing/velta-release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Sign APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE: ${{ env.KS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'velta123' }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'velta' }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'velta123' }}
        run: |
          UNSIGNED=$(find velta-app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n 1)
          if [ -z "$UNSIGNED" ]; then echo "Unsigned APK not found"; exit 1; fi
          echo "Signing $UNSIGNED"

          ALIGNED="${UNSIGNED%.apk}-zipaligned.apk"
          SIGNED="${UNSIGNED%.apk}-signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:"$STORE_PASS" --ks-key-alias "$ALIAS" --key-pass pass:"$KEY_PASS" --out "$SIGNED" "$ALIGNED"

      - name: Rename signed APK with version
        run: |
          VERSION=$(jq -r .version velta-app/src-tauri/tauri.conf.json)
          mkdir -p dist
          for f in velta-app/src-tauri/gen/android/app/build/outputs/apk/*/release/*-signed.apk; do
            abi=$(basename "$(dirname "$(dirname "$f")")")
            # Tauri always names the --apk output flavor "universal"; this
            # pipeline compiles only the aarch64 target, so the APK contains
            # arm64-v8a libs alone — name the asset accordingly. If more
            # --target ABIs are ever added, drop this mapping back to the
            # real flavor name.
            [ "$abi" = "universal" ] && abi=arm64
            cp "$f" "dist/Velta-${VERSION}-${abi}.apk"
          done
          ls -lh dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velta-android
          path: dist/*.apk
