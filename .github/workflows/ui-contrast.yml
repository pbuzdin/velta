name: UI contrast (WCAG AA)

# AGENTS.md 6.4: every text meets WCAG AA in dark, light and brutal, both
# bubble sides, with custom accents. Mock core, headless Chromium.
on:
  push:
    branches: [master]
    paths: ['app/**', 'scripts/e2e-contrast.mjs', 'tests/bubble-label-contrast.test.mjs', 'tests/design-token-guard.test.mjs', 'tests/relay-status-contrast.test.mjs', '.github/workflows/ui-contrast.yml']
  pull_request:
    paths: ['app/**', 'scripts/e2e-contrast.mjs', 'tests/bubble-label-contrast.test.mjs', 'tests/design-token-guard.test.mjs', 'tests/relay-status-contrast.test.mjs', '.github/workflows/ui-contrast.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'All accents (dark, mid, yellow) instead of --quick'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-contrast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrast:
    runs-on: ubuntu-24.04  # Playwright has no chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: scripts/node_modules
          key: pw-nm-${{ runner.os }}-1.56.0
      - name: Token + bubble-label contrast tests
        run: node --test tests/bubble-label-contrast.test.mjs tests/design-token-guard.test.mjs tests/relay-status-contrast.test.mjs tests/chat-appearance.test.mjs
      - name: Install Playwright driver
        working-directory: scripts
        run: npm install --no-fund --no-audit playwright@1.56.0
      - name: Use runner's preinstalled Chrome
        working-directory: scripts
        run: |
          # e2e-contrast.mjs reads CHROMIUM_PATH (executablePath). The runner
          # image ships Google Chrome — skip the ~130MB chromium download and
          # the apt install-deps pass entirely.
          if [ -x /usr/bin/google-chrome ]; then
            echo "CHROMIUM_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium  # fallback only
          fi
      - name: App-wide contrast audit
        run: node scripts/e2e-contrast.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '' || '--quick' }} --json "$RUNNER_TEMP/contrast.json" --shots "$RUNNER_TEMP/contrast-shots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: contrast-report
          path: |
            ${{ runner.temp }}/contrast.json
            ${{ runner.temp }}/contrast-shots
          if-no-files-found: ignore
