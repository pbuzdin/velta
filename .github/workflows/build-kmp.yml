name: Build KMP

on:
  # Unfrozen 2026-11-12: velta-kmp is back in active work (#192) — build
  # on every master push that touches it.
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "velta-kmp/**"
      - "core/**"
      - ".github/workflows/build-kmp.yml"

permissions:
  contents: read

env:
  SHIM_DIR: velta-kmp/native/rpc-shim

jobs:
  # The in-process Android core (native/rpc-shim → libvelta_rpc_shim.so) is
  # NOT committed. It's built on every run and bundled into every APK below
  # (#334) — an APK without it only shows "core shim missing".
  #
  # The finished .so files are cached by their inputs. rust-cache alone still
  # recompiles/links the LTO release (recently ~4 min even on a rust-cache
  # hit). On an artifact-cache hit, skip rustup, rust-cache, and the build;
  # the APK job still verifies each split contains its ABI's .so.
  shim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Runner NDK + rustc are not in the source hash. rustc is preinstalled
      # on ubuntu-latest; the NDK comes from the image (same as before).
      - name: Locate NDK + rustc for the cache key
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"
          echo "RUSTC_VERSION=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_ENV"

      - name: Restore built shim
        id: shim
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: jniLibs
          # crate + vendored core + attachment-crypto (path dep of core) +
          # this workflow (profile, targets, flags) + NDK + rustc.
          # core/ is already the quilt-applied tree; apply-core-patches is
          # not run in this job.
          key: kmp-shim-android-aarch64-x86_64-release-${{ env.NDK_VERSION }}-rust${{ env.RUSTC_VERSION }}-${{ hashFiles('velta-kmp/native/rpc-shim/**', 'core/**', 'packages/attachment-crypto/**', '.github/workflows/build-kmp.yml') }}

      - name: Rust android targets
        if: steps.shim.outputs.cache-hit != 'true'
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Rust cache
        if: steps.shim.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: velta-kmp/native/rpc-shim -> target
          key: android

      - name: Build shim (aarch64 + x86_64)
        if: steps.shim.outputs.cache-hit != 'true'
        working-directory: ${{ env.SHIM_DIR }}
        env:
          TC: ${{ env.NDK }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          export RANLIB="$TC/llvm-ranlib" AR="$TC/llvm-ar" PATH="$TC:$PATH"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CC_x86_64_linux_android="$TC/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TC/x86_64-linux-android24-clang"
          cargo build --release \
            --target aarch64-linux-android --target x86_64-linux-android
          "$TC/llvm-strip" --strip-all \
            target/aarch64-linux-android/release/libvelta_rpc_shim.so
          "$TC/llvm-strip" --strip-all \
            target/x86_64-linux-android/release/libvelta_rpc_shim.so
          # Fail if any debug info or symbol table survived; log the sizes.
          for so in target/*-linux-android/release/libvelta_rpc_shim.so; do
            if "$TC/llvm-readelf" -S -W "$so" | grep -E '\.(debug_|symtab)'; then
              echo "::error::$so still carries debug sections"; exit 1
            fi
            echo "$so: $(stat -c %s "$so") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Laid out as jniLibs/<abi>/ so the APK job can drop it in as-is.
      - name: Stage jniLibs
        if: steps.shim.outputs.cache-hit != 'true'
        run: |
          mkdir -p jniLibs/arm64-v8a jniLibs/x86_64
          cp "$SHIM_DIR/target/aarch64-linux-android/release/libvelta_rpc_shim.so" jniLibs/arm64-v8a/
          cp "$SHIM_DIR/target/x86_64-linux-android/release/libvelta_rpc_shim.so" jniLibs/x86_64/

      - name: Check staged shim
        run: |
          set -euo pipefail
          test -s jniLibs/arm64-v8a/libvelta_rpc_shim.so
          test -s jniLibs/x86_64/libvelta_rpc_shim.so
          ls -la jniLibs/*
          for so in jniLibs/*/*.so; do
            echo "$so: $(stat -c %s "$so") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "shim-cache-hit=${{ steps.shim.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload shim artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-rpc-shim-so
          path: jniLibs/
          if-no-files-found: error

  # Host unit tests of the shim (incl. the #334 auth gate). Runs alongside;
  # the APK doesn't wait for it.
  shim-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: velta-kmp/native/rpc-shim -> target
          key: host

      - name: cargo test
        working-directory: ${{ env.SHIM_DIR }}
        run: cargo test

  build:
    runs-on: ubuntu-latest
    needs: shim
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Fetch the core shim into jniLibs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-rpc-shim-so
          path: velta-kmp/composeApp/src/androidMain/jniLibs

      - name: Build Android debug APK
        working-directory: velta-kmp
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      # Fail the run instead of shipping an APK without the core: every
      # split must carry its ABI's .so.
      - name: Verify the core is in every APK
        working-directory: velta-kmp/composeApp/build/outputs/apk/debug
        run: |
          set -euo pipefail
          ls -la
          check() { unzip -l "$1" | grep -q "lib/$2/libvelta_rpc_shim.so" || { echo "::error::$1 lacks lib/$2/libvelta_rpc_shim.so"; exit 1; }; }
          check composeApp-arm64-v8a-debug.apk arm64-v8a
          check composeApp-x86_64-debug.apk x86_64
          for apk in *.apk; do echo "== $apk $(stat -c %s "$apk") bytes" | tee -a "$GITHUB_STEP_SUMMARY"; unzip -l "$apk" | grep libvelta_rpc_shim.so; done
          VC=$(grep -o '"versionCode": *[0-9]*' output-metadata.json | head -1 | grep -o '[0-9]*$')
          echo "versionCode $VC" | tee -a "$GITHUB_STEP_SUMMARY"

      # Phones: arm64 on its own, small download (#334). x86_64 is for
      # emulators. No universal APK any more.
      - name: Upload arm64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-kmp-arm64-apk
          path: velta-kmp/composeApp/build/outputs/apk/debug/composeApp-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK (emulators)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-kmp-x86_64-apk
          path: velta-kmp/composeApp/build/outputs/apk/debug/composeApp-x86_64-debug.apk
          if-no-files-found: error

      - name: Build desktop distribution
        working-directory: velta-kmp
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon --stacktrace

      - name: Unit tests (desktopTest)
        working-directory: velta-kmp
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace
