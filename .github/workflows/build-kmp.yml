name: Build KMP

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "velta-kmp/**"
      - ".github/workflows/build-kmp.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build Android debug APK
        working-directory: velta-kmp
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: Build desktop distribution
        working-directory: velta-kmp
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon --stacktrace
