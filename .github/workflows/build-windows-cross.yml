name: Build Windows installer (cross-compile sidecar on Ubuntu)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  # Skip NASM when cross-compiling OpenSSL on Linux.
  OPENSSL_NO_ASM: 1
  # Statically link the MinGW C runtime so the sidecar has no extra DLLs.
  RUSTFLAGS: "-C target-feature=+crt-static"

permissions:
  contents: read

jobs:
  build-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Manual-only workflow (not used by Release). Same-input cache is safe.
      - name: Record sidecar cache key
        id: sidecar-key
        run: echo "hash=${{ hashFiles('core/**', 'packages/attachment-crypto/**', '.github/workflows/build-windows-cross.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: velta-kmp/native/rpc-shim/target/x86_64-pc-windows-gnu/release/velta-rpc-server.exe
          key: sidecar-windows-gnu-x86_64-rust1.98-release-crt-static-${{ steps.sidecar-key.outputs.hash }}

      - name: Install Rust toolchain with Windows target
        if: steps.sidecar.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compile toolchain
        if: steps.sidecar.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 perl

      - name: Build velta-rpc-server sidecar for Windows (GNU, #424 shim bin)
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./velta-kmp/native/rpc-shim
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --bin velta-rpc-server --target x86_64-pc-windows-gnu

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-rpc-server-windows-gnu
          path: velta-kmp/native/rpc-shim/target/x86_64-pc-windows-gnu/release/velta-rpc-server.exe

  build-installer:
    needs: [build-sidecar]
    # Test/alternative build only: it publishes artifacts, never releases —
    # official Windows installers come from build-windows.yml.
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Download sidecar from Ubuntu build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-rpc-server-windows-gnu
          path: velta-app/src-tauri/binaries

      - name: Rename sidecar for Tauri bundle
        shell: pwsh
        run: |
          $src = "velta-app/src-tauri/binaries/velta-rpc-server.exe"
          $dst = "velta-app/src-tauri/binaries/velta-rpc-server-x86_64-pc-windows-msvc.exe"
          if (Test-Path $dst) { Remove-Item $dst }
          Move-Item -Path $src -Destination $dst

      - name: Build Tauri Windows installer
        working-directory: ./velta-app
        # No updater signing keys here (they stay in build-windows.yml) and
        # tauri.conf.json sets createUpdaterArtifacts: true — without this
        # override the bundler fails on the missing key (#260).
        run: cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
