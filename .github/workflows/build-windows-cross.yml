name: Build Windows installer (cross-compile sidecar on Ubuntu)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  # Skip NASM when cross-compiling OpenSSL on Linux.
  OPENSSL_NO_ASM: 1
  # Statically link the MinGW C runtime so the sidecar has no extra DLLs.
  RUSTFLAGS: "-C target-feature=+crt-static"

permissions:
  contents: read

jobs:
  build-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain with Windows target
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98
          targets: x86_64-pc-windows-gnu

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 perl

      - name: Build deltachat-rpc-server sidecar for Windows (GNU)
        working-directory: ./core
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build -p deltachat-rpc-server --release --target x86_64-pc-windows-gnu

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deltachat-rpc-server-windows-gnu
          path: core/target/x86_64-pc-windows-gnu/release/deltachat-rpc-server.exe

  # Optional DNS tunnel: velta-app/soar-tunnel as soartunnel.dll (Go
  # c-shared, cgo with mingw-w64), cross-compiled on Ubuntu: windows-latest
  # has no dependable cgo toolchain (Strawberry Perl's gcc shadows PATH).
  # tunnel.rs loads it at runtime from the bundle's resources. -static keeps
  # libgcc/winpthread inside: it imports only KERNEL32 and msvcrt.
  tunnel-dll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: velta-app/soar-tunnel/go.mod
          cache-dependency-path: velta-app/soar-tunnel/go.sum

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build DNS tunnel library (windows/amd64)
        working-directory: ./velta-app/soar-tunnel
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -extldflags=-static" \
            -o ../src-tauri/binaries/soartunnel.dll ./cmd/libsoartunnel
          x86_64-w64-mingw32-objdump -p ../src-tauri/binaries/soartunnel.dll | grep -E "DLL Name|VeltaTunnel"
          ls -l ../src-tauri/binaries/soartunnel.dll

      - name: Upload DNS tunnel library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soartunnel-dll
          path: velta-app/src-tauri/binaries/soartunnel.dll

  build-installer:
    needs: [build-sidecar, tunnel-dll]
    # Uploads release assets on a tag run (softprops/action-gh-release).
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Download sidecar from Ubuntu build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deltachat-rpc-server-windows-gnu
          path: velta-app/src-tauri/binaries

      - name: Rename sidecar for Tauri bundle
        shell: pwsh
        run: |
          $src = "velta-app/src-tauri/binaries/deltachat-rpc-server.exe"
          $dst = "velta-app/src-tauri/binaries/deltachat-rpc-server-x86_64-pc-windows-msvc.exe"
          if (Test-Path $dst) { Remove-Item $dst }
          Move-Item -Path $src -Destination $dst

      - name: Download DNS tunnel library
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: soartunnel-dll
          path: velta-app/src-tauri/binaries

      - name: Build Tauri Windows installer
        working-directory: ./velta-app
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
