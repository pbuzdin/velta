name: Build Linux (.deb, AppImage, Arch)

# #291: manual Linux desktop build (x86_64 .deb + AppImage, plus an Arch
# pacman package repackaged from the .deb via packaging/arch/PKGBUILD). Not wired into release.yml yet.
on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    # Build both Rust binaries against the oldest supported glibc, not the host's.
    container: debian:12
    defaults:
      run:
        shell: bash
    steps:
      # The stock image has neither git nor the tools needed by rustup/linuxdeploy.
      - name: Install Tauri system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git pkg-config python3 binutils xz-utils unzip zstd \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file patchelf perl \
            desktop-file-utils squashfs-tools
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.36"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install tauri-cli (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: debian12-glibc236-v1
          workspaces: |
            ./core
            ./velta-app/src-tauri

      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: core/target/release/deltachat-rpc-server
          key: sidecar-linux-debian12-glibc236-rust1.98-${{ hashFiles('core/**') }}

      - name: Build deltachat-rpc-server sidecar
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          mkdir -p velta-app/src-tauri/binaries
          cp core/target/release/deltachat-rpc-server \
            velta-app/src-tauri/binaries/velta-rpc-server-x86_64-unknown-linux-gnu

      - name: Build Tauri .deb + AppImage
        working-directory: ./velta-app
        env:
          # linuxdeploy is itself an AppImage: no FUSE on runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
          # createUpdaterArtifacts signs bundles; same secrets as Windows.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --bundles deb,appimage

      # #295: no file may be named deltachat-rpc-server (distro packages own it).
      - name: Check package file lists (no deltachat-rpc-server)
        run: |
          set -e
          deb=$(ls velta-app/src-tauri/target/release/bundle/deb/*.deb | head -n1)
          dpkg-deb -c "$deb" | tee /tmp/deb.list
          grep -q 'usr/bin/velta-rpc-server$' /tmp/deb.list
          ! grep -q 'deltachat-rpc-server' /tmp/deb.list
          app=$(ls velta-app/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          chmod +x "$app"
          (cd /tmp && "$OLDPWD/$app" --appimage-extract >/dev/null)
          find /tmp/squashfs-root > /tmp/appimage.list
          grep -q 'usr/bin/velta-rpc-server$' /tmp/appimage.list
          ! grep -q 'deltachat-rpc-server' /tmp/appimage.list

      - name: Check every packaged ELF requires at most GLIBC 2.36
        run: |
          python3 -m unittest discover -s tests -p 'check_glibc_test.py'
          deb=(velta-app/src-tauri/target/release/bundle/deb/*.deb)
          app=(velta-app/src-tauri/target/release/bundle/appimage/*.AppImage)
          dpkg-deb -x "${deb[0]}" /tmp/deb-root
          # Include the AppImage runtime itself, not just its extracted payload.
          python3 tools/check-glibc.py 2.36 /tmp/deb-root /tmp/squashfs-root "${app[0]}" | tee /tmp/glibc-report.txt
          cat /tmp/glibc-report.txt >> "$GITHUB_STEP_SUMMARY"

      # Debian/Ubuntu: install alongside a distro deltachat-rpc-server if the
      # archive has one (skipped otherwise).
      - name: Smoke install next to distro deltachat-rpc-server
        run: |
          deb=$(ls velta-app/src-tauri/target/release/bundle/deb/*.deb | head -n1)
          if apt-cache show deltachat-rpc-server >/dev/null 2>&1; then
            apt-get install -y deltachat-rpc-server
          else
            echo "no deltachat-rpc-server in this archive; installing ours alone"
          fi
          apt-get install -y "./$deb"
          test -x /usr/bin/velta-rpc-server

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-linux-deb
          path: velta-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-linux-appimage
          path: velta-app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-arch:
    needs: build-linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Download .deb
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: velta-linux-deb
          path: deb

      # makepkg refuses root: build as a throwaway user. The .deb is placed
      # under the source name, so makepkg uses it instead of downloading.
      - name: makepkg (velta-bin)
        run: |
          pacman -Syu --noconfirm --needed git
          deb=$(ls deb/*.deb | head -n1)
          ver=$(basename "$deb" | sed -E 's/^Velta_([^_]+)_amd64\.deb$/\1/')
          useradd -m builder
          mkdir -p /tmp/pkg && cp packaging/arch/PKGBUILD /tmp/pkg/
          sed -i "s/^pkgver=.*/pkgver=${ver}/" /tmp/pkg/PKGBUILD
          cp "$deb" "/tmp/pkg/Velta_${ver}_amd64.deb"
          chown -R builder /tmp/pkg
          su builder -c "cd /tmp/pkg && makepkg --nodeps --noconfirm"
          mkdir -p out && cp /tmp/pkg/*.pkg.tar.zst out/

      # #295: file list check + install next to Arch's deltachat-rpc-server.
      - name: Check + smoke install (pacman)
        run: |
          set -e
          pkg=$(ls out/*.pkg.tar.zst | head -n1)
          pacman -Qlp "$pkg" | tee /tmp/arch.list
          grep -q '/usr/bin/velta-rpc-server$' /tmp/arch.list
          ! grep -q 'deltachat-rpc-server' /tmp/arch.list
          pacman -S --noconfirm deltachat-rpc-server
          pacman -U --noconfirm "$pkg"
          test -x /usr/bin/velta-rpc-server
          test -x /usr/bin/deltachat-rpc-server

      - name: Upload Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-arch-pkg
          path: out/*.pkg.tar.zst
          if-no-files-found: error
