name: Build Linux .deb

# #291: manual Linux desktop build (x86_64 .deb). Not wired into release.yml yet.
on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential curl wget file patchelf perl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install tauri-cli (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            ./core
            ./velta-app/src-tauri

      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: core/target/release/deltachat-rpc-server
          key: sidecar-linux-${{ hashFiles('core/**') }}

      - name: Build deltachat-rpc-server sidecar
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          mkdir -p velta-app/src-tauri/binaries
          cp core/target/release/deltachat-rpc-server \
            velta-app/src-tauri/binaries/deltachat-rpc-server-x86_64-unknown-linux-gnu

      - name: Build Tauri .deb
        working-directory: ./velta-app
        env:
          # createUpdaterArtifacts signs bundles; same secrets as Windows.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --bundles deb

      - name: Upload .deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-linux-deb
          path: velta-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
