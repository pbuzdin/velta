name: Build Windows installer

on:
  workflow_call:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The tauri CLI is a ~10-minute source build — cache the binary.
      - name: Restore tauri-cli
        uses: actions/cache@v4
        id: tauri-cli
        with:
          path: ~/cargo/bin/tauri.exe
          key: tauri-cli-v2-windows

      - name: Install cargo-tauri
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0" --locked

      # vendored OpenSSL (via rusqlite/async-native-tls) needs Perl + NASM on Windows.
      - name: Install Strawberry Perl
        run: |
          choco install strawberryperl -y
          echo "C:\strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\perl\site\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # Rust dependency + target caches: without them the sidecar and the
      # app rebuild ~400 crates from scratch on every run (19 + 13 minutes).
      - name: Cache sidecar build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./core
          key: sidecar-windows

      - name: Build deltachat-rpc-server sidecar
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          New-Item -ItemType Directory -Force -Path "velta-app/src-tauri/binaries"
          Copy-Item "core/target/release/deltachat-rpc-server.exe" `
            "velta-app/src-tauri/binaries/deltachat-rpc-server-x86_64-pc-windows-msvc.exe"

      - name: Cache Tauri app build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./velta-app/src-tauri
          key: tauri-app-windows

      - name: Build Tauri Windows installer
        working-directory: ./velta-app
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
