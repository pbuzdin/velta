name: Build Windows installer

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [master]

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # The prebuilt npm CLI is the same tauri v2 orchestrator that
      # `cargo tauri build` would use — without the 10-minute compile.
      - name: Install tauri-cli (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      # vendored OpenSSL (via rusqlite/async-native-tls) needs Perl + NASM on Windows.
      - name: Install Strawberry Perl
        run: |
          choco install strawberryperl -y
          echo "C:\strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\perl\site\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # Record the bundle cache key BEFORE rust-cache restores core/target/
      # and src-tauri/target/ — build outputs inside those paths would change
      # hashFiles every run and make the cache unhittable (same ordering as
      # the sidecar key record above).
      - name: Record bundle cache key
        id: bundle-key
        shell: bash
        run: echo "hash=${{ hashFiles('velta-app/src-tauri/**', 'app/**', 'core/**', 'packages/attachment-crypto/**', '.github/workflows/build-windows.yml') }}" >> "$GITHUB_OUTPUT"

      # Hash sidecar inputs BEFORE rust-cache restores core/target/, which
      # would change hashFiles('core/**'). Restore the exe AFTER rust-cache
      # so a restored target tree cannot overwrite it.
      # Release (workflow_call) reuses this cache: same inputs produce the
      # same unsigned sidecar, so a hit is safe. Signed installers are not cached.
      - name: Record sidecar cache key
        id: sidecar-key
        shell: bash
        run: echo "hash=${{ hashFiles('core/**', 'packages/attachment-crypto/**', 'velta-kmp/native/rpc-shim/**', '.github/workflows/build-windows.yml') }}" >> "$GITHUB_OUTPUT"

      # One cache for BOTH Rust workspaces: two rust-cache steps in one job
      # overwrite each other's restored ~/.cargo state and defeat the cache.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            ./core
            ./velta-kmp/native/rpc-shim
            ./velta-app/src-tauri

      # Frontend-only updates don't change the sidecar: restore the exe built
      # for this exact core state and skip the ~8-minute core build entirely.
      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: velta-kmp/native/rpc-shim/target/release/velta-rpc-server.exe
          key: sidecar-windows-msvc-x86_64-rust1.98-release-${{ steps.sidecar-key.outputs.hash }}

      - name: Build velta-rpc-server sidecar (#424 shim bin)
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./velta-kmp/native/rpc-shim
        run: cargo build --release --locked --bin velta-rpc-server

      - name: Stage sidecar for Tauri bundle
        run: |
          New-Item -ItemType Directory -Force -Path "velta-app/src-tauri/binaries"
          Copy-Item "velta-kmp/native/rpc-shim/target/release/velta-rpc-server.exe" `
            "velta-app/src-tauri/binaries/velta-rpc-server-x86_64-pc-windows-msvc.exe"

      # The unsigned installer bakes in the shell binary, the sidecar, the JS
      # frontend and the version — all in the key (tauri.conf.json's version
      # via src-tauri/**; core/** covers the sidecar inputs). A hit skips
      # cargo AND bundling; the updater .sig was produced with the same
      # TAURI_SIGNING_PRIVATE_KEY every run, so the cached sig stays valid.
      # Signed artifacts are never cached — only the unsigned bundle is, and
      # the sig ships alongside it. Exact key only, no restore-keys fallback.
      - name: Restore unsigned bundles
        id: bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: velta-app/src-tauri/target/release/bundle
          key: bundles-unsigned-windows-x64-rust1.98${{ github.event_name == 'pull_request' && '-pr' || '' }}-${{ steps.bundle-key.outputs.hash }}

      # Pull-request builds bundle unsigned (no updater artifacts, no signing
      # secrets in the job); push, tag and manual builds sign the updater
      # artifact (Velta_*_x64-setup.exe.sig).
      - name: Build Tauri Windows installer (unsigned, pull request)
        if: steps.bundle.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
        working-directory: ./velta-app
        run: tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build Tauri Windows installer
        if: steps.bundle.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        working-directory: ./velta-app
        env:
          # Without these secrets (e.g. a manual dispatch from a fork) the
          # build fails on createUpdaterArtifacts — the updater manifest
          # needs a signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build

      # Belt and suspenders on a cache hit: the restored installer must exist
      # and carry the version this run would have produced. Catches any key
      # blind spot (a new input patched into a file the key does not hash).
      - name: Verify cached installer identity
        if: steps.bundle.outputs.cache-hit == 'true'
        shell: bash
        run: |
          exe=$(ls velta-app/src-tauri/target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -n1)
          test -s "$exe" || { echo "::error::bundle cache hit but no NSIS installer"; exit 1; }
          want=$(node -p "require('./velta-app/src-tauri/tauri.conf.json').version")
          case "$exe" in *_${want}_*) ;; *) echo "::error::cached installer '$exe' does not match conf version ${want}"; exit 1;; esac
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            test -s "${exe}.sig" || { echo "::error::cached updater signature missing for $exe"; exit 1; }
          fi
          msi=$(ls velta-app/src-tauri/target/release/bundle/msi/*.msi 2>/dev/null | head -n1)
          test -s "$msi" || { echo "::error::bundle cache hit but no MSI"; exit 1; }
          echo "Cached installer identity verified: $(basename "$exe")"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
            velta-app/src-tauri/target/release/bundle/nsis/*.sig
