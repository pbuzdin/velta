name: Build Windows installer

on:
  workflow_call:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  # Optional DNS tunnel: velta-app/soar-tunnel as soartunnel.dll (Go
  # c-shared, cgo with mingw-w64), cross-compiled on Ubuntu: windows-latest
  # has no dependable cgo toolchain (Strawberry Perl's gcc shadows PATH).
  # tunnel.rs loads it at runtime from the bundle's resources. -static keeps
  # libgcc/winpthread inside: it imports only KERNEL32 and msvcrt.
  tunnel-dll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: velta-app/soar-tunnel/go.mod
          cache-dependency-path: velta-app/soar-tunnel/go.sum

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build DNS tunnel library (windows/amd64)
        working-directory: ./velta-app/soar-tunnel
        run: |
          go vet ./...
          go test ./...
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -extldflags=-static" \
            -o ../src-tauri/binaries/soartunnel.dll ./cmd/libsoartunnel
          x86_64-w64-mingw32-objdump -p ../src-tauri/binaries/soartunnel.dll | grep -E "DLL Name|VeltaTunnel"
          ls -l ../src-tauri/binaries/soartunnel.dll

      - name: Upload DNS tunnel library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soartunnel-dll
          path: velta-app/src-tauri/binaries/soartunnel.dll

  build-windows:
    needs: tunnel-dll
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (moving branch, Dependabot updates)
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # The prebuilt npm CLI is the same tauri v2 orchestrator that
      # `cargo tauri build` would use — without the 10-minute compile.
      - name: Install tauri-cli (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      # vendored OpenSSL (via rusqlite/async-native-tls) needs Perl + NASM on Windows.
      - name: Install Strawberry Perl
        run: |
          choco install strawberryperl -y
          echo "C:\strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\perl\site\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # One cache for BOTH Rust workspaces: two rust-cache steps in one job
      # overwrite each other's restored ~/.cargo state and defeat the cache.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            ./core
            ./velta-app/src-tauri

      # Frontend-only updates don't change the sidecar: restore the exe built
      # for this exact core state and skip the ~8-minute core build entirely.
      # The cache key hashes core sources BEFORE the Rust cache restores
      # target/ into the tree, so only real source changes move the key.
      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: core/target/release/deltachat-rpc-server.exe
          key: sidecar-exe-${{ hashFiles('core/**') }}

      - name: Build deltachat-rpc-server sidecar
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          New-Item -ItemType Directory -Force -Path "velta-app/src-tauri/binaries"
          Copy-Item "core/target/release/deltachat-rpc-server.exe" `
            "velta-app/src-tauri/binaries/deltachat-rpc-server-x86_64-pc-windows-msvc.exe"

      - name: Download DNS tunnel library
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: soartunnel-dll
          path: velta-app/src-tauri/binaries

      - name: Build Tauri Windows installer
        working-directory: ./velta-app
        env:
          # Signs the updater artifact (Velta_*_x64-setup.exe.sig). Without
          # these secrets (e.g. a manual dispatch from a fork) the build fails
          # on createUpdaterArtifacts — the updater manifest needs a signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
            velta-app/src-tauri/target/release/bundle/nsis/*.sig
