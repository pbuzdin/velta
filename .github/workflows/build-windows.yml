name: Build Windows installer

on:
  workflow_call:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'delta-web-app/**'
      - 'delta-core-service/**'
      - 'deltachat-backend/**'
      - 'core/**'
      - '.github/workflows/build-*.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'delta-web-app/**'
      - 'delta-core-service/**'
      - 'deltachat-backend/**'
      - 'core/**'
      - '.github/workflows/build-*.yml'
  workflow_dispatch:

concurrency:
  # github.job disambiguates reusable-workflow calls: inside the Release run
  # every called workflow inherits the caller's name, so without this both
  # jobs would land in one group and cancel each other.
  group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      # vendored OpenSSL (via rusqlite/async-native-tls) needs Perl + NASM on Windows.
      - name: Install Strawberry Perl
        run: |
          choco install strawberryperl -y
          echo "C:\strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\perl\site\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build deltachat-rpc-server sidecar
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          New-Item -ItemType Directory -Force -Path "delta-web-app/src-tauri/binaries"
          Copy-Item "core/target/release/deltachat-rpc-server.exe" `
            "delta-web-app/src-tauri/binaries/deltachat-rpc-server-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri Windows installer
        working-directory: ./delta-web-app
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velta-windows
          path: |
            delta-web-app/src-tauri/target/release/bundle/msi/*.msi
            delta-web-app/src-tauri/target/release/bundle/nsis/*.exe
