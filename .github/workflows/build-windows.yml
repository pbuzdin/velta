name: Build Windows installer

on:
  workflow_call:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The prebuilt npm CLI is the same tauri v2 orchestrator that
      # `cargo tauri build` would use — without the 10-minute compile.
      - name: Install tauri-cli (prebuilt)
        run: npm install -g @tauri-apps/cli@^2

      # vendored OpenSSL (via rusqlite/async-native-tls) needs Perl + NASM on Windows.
      - name: Install Strawberry Perl
        run: |
          choco install strawberryperl -y
          echo "C:\strawberry\perl\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\perl\site\bin" >> $env:GITHUB_PATH
          echo "C:\strawberry\c\bin" >> $env:GITHUB_PATH

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      # One cache for BOTH Rust workspaces: two rust-cache steps in one job
      # overwrite each other's restored ~/.cargo state and defeat the cache.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./core
            ./velta-app/src-tauri

      # Frontend-only updates don't change the sidecar: restore the exe built
      # for this exact core state and skip the ~8-minute core build entirely.
      # The cache key hashes core sources BEFORE the Rust cache restores
      # target/ into the tree, so only real source changes move the key.
      - name: Restore built sidecar
        id: sidecar
        uses: actions/cache@v4
        with:
          path: core/target/release/deltachat-rpc-server.exe
          key: sidecar-exe-${{ hashFiles('core/**') }}

      - name: Build deltachat-rpc-server sidecar
        if: steps.sidecar.outputs.cache-hit != 'true'
        working-directory: ./core
        run: cargo build -p deltachat-rpc-server --release

      - name: Stage sidecar for Tauri bundle
        run: |
          New-Item -ItemType Directory -Force -Path "velta-app/src-tauri/binaries"
          Copy-Item "core/target/release/deltachat-rpc-server.exe" `
            "velta-app/src-tauri/binaries/deltachat-rpc-server-x86_64-pc-windows-msvc.exe"

      - name: Build Tauri Windows installer
        working-directory: ./velta-app
        env:
          # Signs the updater artifact (Velta_*_x64-setup.exe.sig). Without
          # these secrets (e.g. a manual dispatch from a fork) the build fails
          # on createUpdaterArtifacts — the updater manifest needs a signature.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velta-windows
          path: |
            velta-app/src-tauri/target/release/bundle/msi/*.msi
            velta-app/src-tauri/target/release/bundle/nsis/*.exe
            velta-app/src-tauri/target/release/bundle/nsis/*.sig
