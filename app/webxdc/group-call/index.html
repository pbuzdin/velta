<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velta Circle</title>
<link rel="stylesheet" href="velta-tokens.css">
<style>
  /* Velta design-system tokens come from velta-tokens.css (generated from
     app/css/main.css; dark/light via prefers-color-scheme). Inside Velta the
     host also sends its live values (theme + custom accent) via getTheme().
     No other colors or sizes here. */
  :root { --av-ink: #f4f4f4; /* avatar initials; fills keep >= 3:1 (large bold text) */ }
  * { box-sizing: border-box; }
  body { margin: 0; font: var(--fs-4)/1.4 var(--font);
    background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: var(--sp-3) var(--sp-4) var(--sp-1); }
  h1 { font-size: var(--fs-5); margin: 0; font-weight: 600; }
  .sub { color: var(--text-dim); font-size: var(--fs-2); margin-top: 2px; }
  main { flex: 1; padding: var(--sp-2) var(--sp-3); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--sp-2); }
  .tile { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-bubble); padding: var(--sp-3) var(--sp-2) var(--sp-2); text-align: center; position: relative; }
  .av { width: 56px; height: 56px; border-radius: 22%; margin: 0 auto var(--sp-2); display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--av-ink); outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
  .tile.speaking .av { outline-color: var(--green); }
  .tile.active .name { color: var(--green); }
  .name { font-size: var(--fs-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: var(--fs-1); color: var(--text-dim); min-height: 14px; }
  .mute-ic { position: absolute; top: var(--sp-2); right: var(--sp-2); font-size: var(--fs-3); }
  .bar { display: flex; gap: var(--sp-2); justify-content: center; padding: var(--sp-3) var(--sp-3) calc(var(--sp-3) + env(safe-area-inset-bottom)); }
  button { font: inherit; font-size: var(--fs-4); font-weight: 600; border: 0; border-radius: var(--radius-pill); padding: var(--sp-3) var(--sp-5); cursor: pointer;
    background: var(--bg-hover); color: var(--accent-text); min-width: 64px; }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.danger { color: var(--danger); }
  button[aria-pressed="true"] { background: var(--bg-active); color: var(--on-accent); }
  @media (hover: hover) and (pointer: fine) { button.primary:hover { background: var(--accent-hover); } }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .notice { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-bubble); padding: var(--sp-4); margin: var(--sp-2) 0 var(--sp-3); font-size: var(--fs-3); }
  .notice b { display: block; font-size: var(--fs-5); margin-bottom: var(--sp-1); }
  .note { color: var(--text-dim); font-size: var(--fs-1); text-align: center; padding: 0 var(--sp-4) var(--sp-1); }
  /* outside Velta only: selectable address + link (Delta Chat may block links) */
  .notice, .notice * { min-width: 0; overflow-wrap: anywhere; }
  .roster { display: block; margin-top: var(--sp-2); color: var(--text-dim); }
  .cta { display: block; color: var(--text); user-select: text; -webkit-user-select: text; }
  .cta a { color: var(--accent-text); user-select: text; -webkit-user-select: text; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="title">Group call</h1>
  <div class="sub" id="creator"></div>
  <div class="sub" id="sub" aria-live="polite">Loading…</div>
</header>
<main>
  <div class="notice" id="needs-velta" hidden>
    <b>Open in Velta to join</b>
    <span class="cta" id="velta-cta">This call runs in Velta. Get it · <a href="https://velta.cc" target="_blank" rel="noopener">velta.cc</a></span>
    <span class="roster" id="dc-roster"></span>
  </div>
  <div class="notice" id="full" hidden><b>The call is full</b>Up to <span id="max">6</span> people can talk at once. You'll be connected when someone leaves.</div>
  <div class="notice" id="error" hidden></div>
  <div class="grid" id="grid" role="list" aria-label="Participants"></div>
</main>
<div class="note" id="note" hidden>Audio is relayed through TURN servers, so other participants don't see your IP address.</div>
<div class="bar">
  <button class="primary" id="join" hidden>Join call</button>
  <button id="mute" aria-pressed="false" hidden>Mute</button>
  <button class="danger" id="leave" hidden>Leave</button>
</div>
<script src="main.js"></script>
</body>
</html>
