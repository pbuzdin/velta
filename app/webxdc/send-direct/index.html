<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velta Beam</title>
<style>
  :root { color-scheme: light dark; --accent: #3d8bfd; --dim: #8a94a3; }
  body { font: 15px/1.45 system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.note { color: var(--dim); font-size: 13.5px; margin: 0 0 14px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  button.sec { background: transparent; color: var(--accent); padding: 6px 8px; }
  button:disabled { opacity: .5; cursor: default; }
  .card { border: 1px solid rgba(127,127,127,.3); border-radius: 10px; padding: 12px; margin: 10px 0; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { color: var(--dim); font-size: 13px; }
  progress { width: 100%; height: 6px; margin-top: 8px; accent-color: var(--accent); }
  .ok { color: #2e9d57; } .bad { color: #d64545; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  ul.peers { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; }
  ul.peers li { display: grid; grid-template-columns: minmax(0,1fr) 30% auto; gap: 8px; align-items: center; padding: 2px 0; }
  ul.peers .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.peers progress { margin: 0; }
  ul.peers .ps { color: var(--dim); }
  #peers { font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<h1>Velta Beam</h1>
<p class="note">Peer to peer while both of you have this app open — no server stores the file. Encrypted in transit; checked with SHA-256 on arrival.</p>
<div class="row"><button id="pick">Choose a file to send…</button></div>
<div id="peers" aria-live="polite"></div>
<div id="list"></div>
<script src="main.js"></script>
</body>
</html>
