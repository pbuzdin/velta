<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velta Beam</title>
<link rel="stylesheet" href="velta-tokens.css">
<style>
  /* Velta design system: every color/size is a token from velta-tokens.css
     (generated from app/css/main.css). */
  * { box-sizing: border-box; }
  body { font: var(--fs-4)/1.45 var(--font); margin: 0; padding: var(--sp-4); background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column; }
  h1 { font-size: var(--fs-5); font-weight: 600; margin: 0 0 var(--sp-1); }
  p.note { color: var(--text-dim); font-size: var(--fs-3); margin: 0 0 var(--sp-3); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: var(--radius-pill); padding: var(--sp-2) var(--sp-4);
    background: var(--accent); color: var(--on-accent); cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { button:not(:disabled):not(.sec):hover { background: var(--accent-hover); } }
  button.sec { background: transparent; color: var(--accent-text); padding: var(--sp-1) var(--sp-2); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-media); padding: var(--sp-3); margin: var(--sp-2) 0; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { color: var(--text-dim); font-size: var(--fs-2); }
  progress { width: 100%; height: 6px; margin-top: var(--sp-2); accent-color: var(--accent); }
  .ok { color: var(--green); } .bad { color: var(--danger); }
  .row { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
  ul.peers { list-style: none; margin: var(--sp-2) 0 0; padding: 0; font-size: var(--fs-2); }
  ul.peers li { display: grid; grid-template-columns: minmax(0,1fr) 30% auto; gap: var(--sp-2); align-items: center; padding: 2px 0; }
  ul.peers .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.peers progress { margin: 0; }
  ul.peers .ps { color: var(--text-dim); }
  #peers { font-size: var(--fs-2); color: var(--text-dim); }
  #list { flex: 1; }
  /* outside Velta only (ui.js): one quiet line, never a popup. The address is
     plain selectable text too, since Delta Chat may block external links. */
  .cta { margin: var(--sp-4) 0 0; text-align: center; font-size: var(--fs-1); color: var(--text-dim); user-select: text; -webkit-user-select: text; }
  .cta a { color: var(--accent-text); user-select: text; -webkit-user-select: text; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Velta Beam</h1>
<p class="note">Peer to peer while both of you have this app open — no server stores the file. Encrypted in transit; checked with SHA-256 on arrival.</p>
<div class="row"><button id="pick">Choose a file to send…</button></div>
<div id="peers" aria-live="polite"></div>
<div id="list"></div>
<p class="cta" id="velta-cta" hidden>Faster transfers with Velta · <a href="https://velta.cc" target="_blank" rel="noopener">velta.cc</a></p>
<script src="main.js"></script>
</body>
</html>
