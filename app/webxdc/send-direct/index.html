<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velta Beam</title>
<link rel="stylesheet" href="velta-tokens.css">
<style>
  /* Velta design system: every color/size is a token from velta-tokens.css
     (generated from app/css/main.css). */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font: var(--fs-4)/1.45 var(--font); margin: 0; padding: var(--sp-3); background: var(--bg); color: var(--text);
    min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  h1 { font-size: var(--fs-5); font-weight: 600; margin: 0; }
  .toprow { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  p.note { color: var(--text-dim); font-size: var(--fs-3); margin: var(--sp-1) 0 var(--sp-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  button.count { background: transparent; color: var(--text-dim); font-size: var(--fs-2); font-weight: 600; padding: var(--sp-1) var(--sp-2); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: var(--radius-pill); padding: var(--sp-2) var(--sp-4);
    background: var(--accent); color: var(--on-accent); cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { button:not(:disabled):not(.sec):not(.count):hover { background: var(--accent-hover); } }
  button.sec { background: transparent; color: var(--accent-text); padding: var(--sp-1) var(--sp-2); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: var(--radius-media); padding: var(--sp-3); margin: var(--sp-2) 0; }
  .name { font-weight: 600; word-break: break-all; }
  .meta { color: var(--text-dim); font-size: var(--fs-2); }
  progress { width: 100%; height: 6px; margin-top: var(--sp-2); accent-color: var(--accent); }
  .ok { color: var(--green); } .bad { color: var(--danger); }
  .row { display: flex; gap: var(--sp-2); flex-wrap: wrap; margin-top: var(--sp-2); }
  ul.peers { list-style: none; margin: var(--sp-2) 0 0; padding: 0; font-size: var(--fs-2); }
  ul.peers li { display: grid; grid-template-columns: minmax(0,1fr) 30% auto; gap: var(--sp-2); align-items: center; padding: 2px 0; }
  ul.peers .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.peers progress { margin: 0; }
  ul.peers .ps { color: var(--text-dim); }
  header { flex: none; }
  #peers:empty { display: none; }
  #peers { margin: var(--sp-2) 0 0; font-size: var(--fs-2); color: var(--text-dim); }
  #list { flex: 1; min-height: 0; overflow: auto; }
  /* Once a file is listed, drop the title and intro. The host bar already
     names the app, and the short desktop panel has to spend its height on
     the cards. The choose button and the count stay, on one row. */
  body.has-files h1, body.has-files .note { display: none; }
  body.has-files header { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
  body.has-files .toprow { flex: 1; margin: 0; }
  body.has-files header .row { margin-top: 0; }
  body.has-files #peers { flex-basis: 100%; margin-top: 0; }
  footer { flex: none; display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-3);
    margin-top: var(--sp-2); font-size: var(--fs-2); color: var(--text-dim); }
  /* outside Velta only (ui.js): one quiet line, never a popup. The address is
     plain selectable text too, since Delta Chat may block external links. */
  .cta { margin: 0; text-align: right; font-size: var(--fs-2); color: var(--text-dim); user-select: text; -webkit-user-select: text; }
  .cta a { color: var(--accent-text); user-select: text; -webkit-user-select: text; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1>Velta Beam</h1>
    <button type="button" id="count" class="count" hidden></button>
  </div>
  <p class="note">Peer to peer: everyone in this chat who opens Beam can receive, and whoever has the file passes it on. No server stores it. Encrypted in transit; checked with SHA-256.</p>
  <div class="row"><button id="pick">Choose a file to send…</button></div>
  <div id="peers" aria-live="polite"></div>
</header>
<div id="list"></div>
<footer>
  <span>v1.2</span>
  <p class="cta" id="velta-cta" hidden>Faster transfers with Velta · <a href="https://velta.cc" target="_blank" rel="noopener">velta.cc</a></p>
</footer>
<script src="webxdc.js"></script>
<script src="main.js"></script>
</body>
</html>
