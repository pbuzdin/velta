<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velta — connection diagnostics</title>
<!-- Dev page: whole-page inline script, so script-src needs 'unsafe-inline'
     here; the messenger surface (index.html) stays strict. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://127.0.0.1:20808">
<style>
  body { font: 14px/1.6 system-ui, sans-serif; background: #0f0f14; color: #eee; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 19px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 10px; background: #1a1a22; margin: 8px 0; }
  .badge { flex: none; font-weight: 700; }
  .ok .badge { color: #37c85f; }
  .fail .badge { color: #e05252; }
  .run .badge { color: #e6a23c; }
  .detail { color: #999; font-size: 12.5px; word-break: break-all; }
  code { background: #101010; padding: 1px 6px; border-radius: 5px; }
  #ver { color: #666; font-size: 12px; margin-top: 20px; }
  button { background: #5aa2e6; color: #f4f4f4; border: 0; border-radius: 8px; padding: 9px 18px; font-size: 14px; }
</style>
</head>
<body>
<h1>Background service diagnostics</h1>
<p>This page probes the Velta Core service from your browser, step by step.</p>
<div id="log"></div>
<button type="button" id="rerun">Run again</button>
<div id="ver"></div>

<script>
const log = document.getElementById("log");
const WS_URL = "ws://127.0.0.1:20808";

function row(name) {
  const el = document.createElement("div");
  el.className = "row run";
  el.innerHTML = `<span class="badge">…</span><div><div>${name}</div><div class="detail"></div></div>`;
  log.appendChild(el);
  return {
    ok(detail) { el.className = "row ok"; el.querySelector(".badge").textContent = "OK"; el.querySelector(".detail").textContent = detail || ""; },
    fail(detail) { el.className = "row fail"; el.querySelector(".badge").textContent = "FAIL"; el.querySelector(".detail").textContent = detail || ""; },
  };
}

// Opens the bridge socket; resolves the open WebSocket or null.
function openWs() {
  const r = row("WebSocket " + WS_URL);
  return new Promise(res => {
    let ws;
    try { ws = new WebSocket(WS_URL); } catch (e) { r.fail("constructor threw: " + e); return res(null); }
    const t = setTimeout(() => { try { ws.close(); } catch {} r.fail("timeout — service not listening?"); res(null); }, 2000);
    ws.onopen = () => { clearTimeout(t); r.ok("socket opened"); res(ws); };
    ws.onerror = () => { clearTimeout(t); r.fail("browser blocked/refused the socket (Chrome blocks ws:// to loopback from HTTPS-hosted pages)"); res(null); };
  });
}

// One JSON-RPC call over the socket (after the token was sent).
function call(ws, id, method, params = []) {
  return new Promise((res, rej) => {
    const done = () => { clearTimeout(t); ws.removeEventListener("message", on); ws.removeEventListener("close", closed); };
    const t = setTimeout(() => { done(); rej(new Error("no answer in 8 s")); }, 8000);
    // The bridge closes the socket on a wrong token.
    function closed() { done(); rej(new Error("the service closed the socket — wrong or stale token?")); }
    ws.addEventListener("close", closed);
    function on(e) {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.id !== id) return;
      done();
      if (msg.error) rej(new Error(JSON.stringify(msg.error))); else res(msg.result);
    }
    ws.addEventListener("message", on);
    ws.send(JSON.stringify({ jsonrpc: "2.0", id, method, params }));
  });
}

async function testRpc(ws) {
  const token = localStorage.getItem("velta-bridge-token") || "";
  const r = row("JSON-RPC over the socket — get_all_account_ids (token from velta-bridge-token)");
  if (!token) { r.fail("no velta-bridge-token in this origin's localStorage — pair from the service app first"); return false; }
  ws.send(token);
  try {
    const ids = await call(ws, 999001, "get_all_account_ids");
    r.ok("core answered: " + JSON.stringify(ids));
    const a = row("get_account_info (needs an account id)");
    if (!ids.length) { a.ok("no accounts yet — normal on a fresh install; the PWA will offer onboarding"); return true; }
    a.ok(JSON.stringify(await call(ws, 999002, "get_account_info", [ids[0]])).slice(0, 200));
    return true;
  } catch (e) { r.fail(String(e.message || e)); return false; }
}

async function main() {
  log.innerHTML = "";
  document.getElementById("ver").textContent =
    "app build: " + (await fetch("sw.js").then(r => r.text()).then(t => (t.match(/velta-v\d+/) || ["?"])[0]).catch(() => "?"))
    + " · served from: " + location.origin + " · " + navigator.userAgent;
  const ws = await openWs();
  const ok = ws ? await testRpc(ws) : false;
  try { ws?.close(); } catch {}
  const advice = document.createElement("p");
  advice.innerHTML = ok
    ? "The service is reachable. If the app still shows demo mode, it is running an <b>old cached version</b> — close the PWA completely and reopen it twice, or clear site data."
    : "The service bridge is not usable from this page. Check that the service APK is installed, the “Velta core running” notification is present, and the pairing token is set.";
  log.appendChild(advice);
}

document.getElementById("rerun").addEventListener("click", main);
main();
</script>
</body>
</html>
