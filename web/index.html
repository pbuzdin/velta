<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
<title>Velta</title>
<meta name="description" content="Velta — Delta Chat web client: chatmail relays, end-to-end encrypted messaging">
<meta name="theme-color" content="#0f0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/main.css">
<!-- CSP for the browser/PWA path (no Tauri header there). Keep in sync with
     velta-app/src-tauri/tauri.conf.json "security.csp" — the Tauri-only
     scheme tokens (ipc:, asset:, …) are inert in a plain browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-8g+JKwDwKdYL2n4VrSU5f2pYq799ckvbz9HvJpfpNF8=' 'wasm-unsafe-eval'; connect-src 'self' wss: ipc: http://ipc.localhost http://127.0.0.1:* http://blobfile.localhost blobfile: https: wss:; frame-src 'self' https: http://webxdc.localhost webxdc: http://127.0.0.1:* http://blobfile.localhost blobfile:; img-src 'self' data: blob: file: asset: blobfile: http://blobfile.localhost http://asset.localhost http://127.0.0.1:* http://webxdc.localhost; media-src 'self' blob: asset: blobfile: http://blobfile.localhost http://asset.localhost http://127.0.0.1:*; style-src 'self' 'unsafe-inline'">
<script src="js/ui-scale.js"></script>
<script src="js/chat-appearance.js"></script>
<script src="js/boot-net.js"></script>
<!-- defer (#48): an 80 KB parser-blocking script holds first paint; app.js
     is a module and runs after deferred scripts, so the global VirtualScroller
     class still exists before any `new VirtualScroller`. -->
<script defer src="vendor/virtual-scroller.js"></script>
</head>
<body>
<div id="boot-error" hidden>
  <strong data-i18n="Velta hit a startup error">Velta hit a startup error</strong>
  <code></code>
  <button type="button" id="boot-error-reload" data-i18n="Reload">Reload</button>
</div>
<div id="app" class="app">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
      <header class="sidebar-head">
        <img class="sidebar-logo" src="./icons/v-logo.svg" alt="" aria-hidden="true">
        <button type="button" id="btn-search" class="icon-btn" title="Search chats" aria-label="Search chats" data-i18n-label="Search chats">
          <svg data-icon="search"></svg>
        </button>
      </header>
    <div id="lc-card" class="lc-card" hidden></div>
    <div class="relay-zone">
      <div id="relay-line" class="relay-line" data-state="connecting" role="status"></div>
      <div id="relay-detail" class="relay-detail"></div>
    </div>
    <div id="chat-categories" class="chat-cats" role="toolbar" aria-label="Chat categories" data-i18n-aria="Chat categories" hidden>
      <button type="button" data-cat="all" class="active" data-i18n="All">All</button>
      <button type="button" data-cat="unread" data-i18n="Unread">Unread</button>
      <button type="button" data-cat="people" data-i18n="People">People</button>
      <button type="button" data-cat="groups" data-i18n="Groups">Groups</button>
      <button type="button" data-cat="channels" data-i18n="Channels">Channels</button>
      <button type="button" data-cat="bots" data-i18n="Bots">Bots</button>
      <button type="button" data-cat="system" data-i18n="System">System</button>
    </div>
    <nav id="chat-list" class="chat-list" role="listbox" aria-label="Chats" data-i18n-aria="Chats"></nav>
    <footer class="list-bar" role="toolbar" aria-label="Chat list actions" data-i18n-aria="Chat list actions">
      <button type="button" id="bar-chats" class="bar-btn" data-view="chats" title="Chats" aria-label="Chats" data-i18n-label="Chats">
        <svg data-icon="chats"></svg>
      </button>
      <button type="button" id="bar-contacts" class="bar-btn" data-view="contacts" title="Contacts" aria-label="Contacts" data-i18n-label="Contacts">
        <svg data-icon="contacts"></svg>
      </button>
      <button type="button" id="bar-calls" class="bar-btn" data-view="calls" title="Calls" aria-label="Calls" data-i18n-label="Calls">
        <svg data-icon="phone"></svg>
      </button>
      <button type="button" id="bar-qr" class="bar-btn" data-view="qr" title="QR code" aria-label="QR code" data-i18n-label="QR code">
        <svg data-icon="qr"></svg>
      </button>
      <button type="button" id="btn-new-chat" class="bar-btn bar-accent" title="New chat, group, or channel" aria-label="New chat, group, or channel" data-i18n-label="New chat, group, or channel">
        <svg data-icon="plus"></svg>
      </button>
      <button type="button" id="bar-menu" class="bar-btn" title="Menu" aria-label="Menu" data-i18n-label="Menu">
        <svg data-icon="menu"></svg>
      </button>
    </footer>
  </aside>

  <!-- Main chat column -->
  <main id="main" class="main">
    <div id="no-chat" class="no-chat">
      <div class="no-chat-badge" data-i18n="Select a chat to start messaging">Select a chat to start messaging</div>
      <p class="no-chat-sub" data-i18n="End-to-end encrypted · powered by chatmail relays">End-to-end encrypted · powered by chatmail relays</p>
    </div>

    <section id="chat-view" class="chat-view" hidden>
      <progress id="chat-load-bar" class="chat-load-bar" aria-label="Loading chat history" data-i18n-aria="Loading chat history"></progress>
      <header class="chat-head">
        <button type="button" id="btn-back" class="icon-btn only-mobile" aria-label="Back" data-i18n-aria="Back">
          <svg data-icon="chevronLeft"></svg>
        </button>
        <div id="chat-head-info" class="chat-head-info"></div>
        <div id="chat-head-actions" class="chat-head-actions">
          <button type="button" id="btn-call" class="icon-btn" title="Audio call" aria-label="Audio call" data-i18n-label="Audio call" hidden>
            <svg data-icon="phone"></svg>
          </button>
          <button type="button" id="btn-video-call" class="icon-btn" title="Video call" aria-label="Video call" data-i18n-label="Video call" hidden>
            <svg data-icon="videoCall"></svg>
          </button>
          <button type="button" id="btn-channel-author" class="icon-btn" title="Message author" aria-label="Message author" data-i18n-label="Message author" hidden>
            <svg data-icon="chatLines"></svg>
          </button>
          <button type="button" id="btn-chat-search" class="icon-btn" title="Search in chat" aria-label="Search in chat" data-i18n-label="Search in chat">
            <svg data-icon="search"></svg>
          </button>
          <button type="button" id="btn-chat-menu" class="icon-btn" title="Chat menu" aria-label="Chat menu" data-i18n-label="Chat menu">
            <svg data-icon="dotsVerticalLg"></svg>
          </button>
        </div>
        <div id="selection-bar" class="selection-bar" hidden>
          <button type="button" id="btn-sel-close" class="icon-btn" aria-label="Cancel selection" data-i18n-aria="Cancel selection">
            <svg data-icon="close"></svg>
          </button>
          <span id="sel-count" class="sel-count">0</span>
          <div class="sel-actions">
            <button type="button" class="icon-btn" data-sel="reply" title="Reply" data-i18n-label="Reply"><svg data-icon="reply"></svg></button>
            <button type="button" class="icon-btn" data-sel="forward" title="Forward" data-i18n-label="Forward"><svg data-icon="forward"></svg></button>
            <button type="button" class="icon-btn" data-sel="copy" title="Copy" data-i18n-label="Copy"><svg data-icon="copy"></svg></button>
            <button type="button" class="icon-btn" data-sel="star" title="Save to Saved Messages" data-i18n-label="Save to Saved Messages"><svg data-icon="star"></svg></button>
            <button type="button" class="icon-btn" data-sel="delete" title="Delete" data-i18n-label="Delete"><svg data-icon="trash"></svg></button>
            <button type="button" class="icon-btn" data-sel="info" title="Message info" data-i18n-label="Message info"><svg data-icon="info"></svg></button>
          </div>
        </div>
      </header>

      <div id="history-scroll" class="history-scroll">
        <div id="history" class="history"></div>
        <button type="button" id="btn-go-down" class="go-down" hidden aria-label="Scroll to bottom" data-i18n-aria="Scroll to bottom">
          <svg data-icon="chevronDown"></svg>
          <span id="go-down-badge" class="go-down-badge" hidden></span>
        </button>
      </div>

      <div id="reply-preview" class="reply-preview" hidden>
        <div class="reply-bar"></div>
        <div class="reply-body">
          <div id="reply-name" class="reply-name"></div>
          <div id="reply-text" class="reply-text"></div>
        </div>
        <button type="button" id="btn-reply-close" class="icon-btn" aria-label="Cancel reply" data-i18n-aria="Cancel reply">
          <svg data-icon="close"></svg>
        </button>
      </div>

      <!-- Pending attachment strip (official-client pattern): media block
           above the composer input, caption = the composer text itself. -->
      <div id="media-preview" class="media-preview" hidden>
        <div id="media-preview-thumb"></div>
        <div class="media-preview-side">
          <div id="media-preview-name" class="media-preview-name"></div>
          <button id="btn-media-crop" class="btn-text" type="button" hidden data-i18n="Crop">Crop</button>
        </div>
        <button type="button" id="btn-media-close" class="icon-btn" aria-label="Remove attachment" data-i18n-aria="Remove attachment">
          <svg data-icon="close"></svg>
        </button>
      </div>

      <div id="link-preview-draft" class="media-preview" hidden>
        <div data-lp-body class="lp-draft-body"></div>
        <button id="btn-lp-dismiss" class="icon-btn" type="button" aria-label="Don't send link preview" data-i18n-aria="Don't send link preview">
          <svg data-icon="close"></svg>
        </button>
      </div>

      <div id="voice-rec" class="media-preview" hidden>
        <span class="voice-rec-dot" aria-hidden="true"></span>
        <span id="voice-rec-label" data-i18n="Recording 0:00">Recording 0:00</span>
        <button id="btn-voice-cancel" class="btn-text" type="button" data-i18n="Cancel">Cancel</button>
        <button id="btn-voice-send" class="btn-text" type="button" aria-pressed="true" data-i18n="Send">Send</button>
      </div>

      <div id="diagnostic-actions" class="composer" hidden>
        <button id="btn-diag-pause" class="icon-btn" type="button" title="Pause diagnostics" aria-label="Pause diagnostics" data-i18n-label="Pause diagnostics" aria-pressed="false">
          <svg data-icon="pause"></svg>
        </button>
        <label class="diag-switch"><input type="checkbox" id="sw-logging"> <span data-i18n="Logging">Logging</span></label>
        <label class="diag-switch"><input type="checkbox" id="sw-devtools"> <span data-i18n="DevTools">DevTools</span></label>
        <div class="btn-group" role="group" aria-label="Restart" data-i18n-aria="Restart">
          <span class="btn-group-label" data-i18n="Restart:">Restart:</span>
          <button id="btn-restart-core" class="btn-text" type="button" data-i18n="Core">Core</button>
          <button id="btn-reconnect-ui" class="btn-text" type="button" data-i18n="UI">UI</button>
        </div>
      </div>

      <footer id="main-composer" class="composer">
        <button type="button" id="btn-attach" class="icon-btn" title="Attach" aria-label="Attach" data-i18n-label="Attach">
          <svg data-icon="attach"></svg>
        </button>
        <div class="composer-input-wrap">
          <textarea id="composer-input" rows="1" placeholder="Message" aria-label="Message" data-i18n-placeholder="Message" data-i18n-aria="Message" enterkeyhint="send" autocapitalize="sentences" autocomplete="off"></textarea>
          <button type="button" id="btn-sticker" class="icon-btn" title="Stickers" aria-label="Stickers" data-i18n-label="Stickers">
            <svg data-icon="sticker"></svg>
          </button>
        </div>
        <button type="button" id="btn-send" class="icon-btn send-btn" title="Send" aria-label="Send" data-i18n-label="Send">
          <svg data-icon="send"></svg>
        </button>
      </footer>
    </section>
  </main>
</div>

<div id="popups"></div>
<div id="toasts" class="toasts"></div>

<script src="pwa-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
