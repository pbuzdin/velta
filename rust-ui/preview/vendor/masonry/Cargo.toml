[package]
name = "masonry"
version = "0.4.0" # We mimic Xilem's version
description = "Traits and types of the Masonry toolkit."
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"

[features]
default = []

[dependencies]
accesskit = "0.24.0"
masonry_core = { git = "https://github.com/linebender/xilem", rev = "dc49687", default-features = false }
smallvec = "1.15.1"
tracing = { version = "0.1.44", features = ["default"] }
include_doc_path = { version = "0.1.0", package = "linebender_include_doc_path" }
resvg = "0.47.0"
understory_virtual_list = "0.1.2"
