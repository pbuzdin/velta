[package]
name = "velta-preview"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Velta Rust preview UI (Masonry). Experimental, see #314."
publish = false

# Standalone: not part of core's workspace.
[workspace]

[lib]
name = "velta_preview"
# cdylib is what cargo-apk packages on Android.
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu"]
# Vello on the GPU (wgpu). The CPU path (vello_cpu) needs our own host; see README.
gpu = ["masonry_winit/imaging_vello"]
hybrid = ["masonry_winit/imaging_vello_hybrid"]

[dependencies]
deltachat = { path = "../../core" }
masonry = { git = "https://github.com/linebender/xilem", rev = "dc49687", default-features = false }
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "dc49687", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qrcodegen = "1.8"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
android_logger = "0.15"
log = "0.4"
jni = "0.21"
ndk-context = "0.1"

# cargo apk build --release  (debug-signed test APK; installs next to Velta)
[package.metadata.android]
package = "cc.velta.preview"
apk_name = "velta-preview"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Velta Preview"
debuggable = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
lto = "thin"
codegen-units = 4
