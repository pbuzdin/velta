[package]
name = "velta-preview"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Velta Rust preview UI (Masonry). Experimental, see #314."
publish = false

# Standalone: not part of core's workspace.
[workspace]
members = ["vendor/masonry_winit", "vendor/masonry"]

[lib]
name = "velta_preview"
# cdylib is what cargo-apk packages on Android.
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu", "glass"]
# Vello on the GPU (wgpu). The CPU path (vello_cpu) needs our own host; see README.
gpu = ["masonry_winit/imaging_vello"]
hybrid = ["masonry_winit/imaging_vello_hybrid"]
# Skia renderer — the CPU/GPU rasterizer with a full image-filter suite
# (displacement maps, blur); renders colour emoji on Android where vello
# hybrid cannot. Experimental; see #315.
skia = ["masonry_winit/imaging_skia", "dep:skia-safe"]
# GPU-host refraction (liquid glass) in the vendored masonry_winit host;
# omit for the plain translucent bar. docs/agents/rust-ui-glass.md.
glass = ["masonry_winit/glass"]
# Android activity backend, picked per build: NativeActivity ships via cargo-apk,
# GameActivity (androidx.games — the IME/insets backend the composer needs) via the
# Gradle shell in android/. Exactly one must be enabled for an Android build.
native-activity = ["winit/android-native-activity"]
game-activity = ["winit/android-game-activity"]

[dependencies]
deltachat = { path = "../../core" }
masonry = { git = "https://github.com/linebender/xilem", rev = "dc49687", default-features = false }
masonry_winit = { git = "https://github.com/linebender/xilem", rev = "dc49687", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qrcodegen = "1.8"
# Direct skia access for the glass prototype (gate 4, docs/agents/rust-ui-glass.md);
# same crate imaging_skia pulls, so the bindings build is shared.
skia-safe = { version = "0.93", optional = true }

# Liquid-glass filter-chain prototype: desktop/CI only, needs the skia feature.
[[bin]]
name = "glass_proto"
path = "src/bin/glass_proto.rs"
required-features = ["skia"]

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13" }
android_logger = "0.15"
log = "0.4"
jni = "0.21"
ndk-context = "0.1"

# cargo apk build --release  (debug-signed test APK; installs next to Velta)
[package.metadata.android]
package = "cc.velta.preview"
apk_name = "velta-preview"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "Velta Preview"
debuggable = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
lto = "thin"
codegen-units = 4

[patch."https://github.com/linebender/xilem"]
masonry_winit = { path = "vendor/masonry_winit" }
masonry = { path = "vendor/masonry" }
