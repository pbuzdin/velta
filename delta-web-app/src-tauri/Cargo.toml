[package]
name = "delta-web"
version = "1.1.0"
description = "Velta — Delta Chat client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "delta_web"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "delta-web"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

# Android links the Delta Chat core in-process instead of spawning a sidecar.
[target.'cfg(target_os = "android")'.dependencies]
deltachat-jsonrpc = { path = "../../core/deltachat-jsonrpc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
futures-lite = "2"
yerpc = "0.6"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
