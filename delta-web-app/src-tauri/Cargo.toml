[package]
name = "delta-web"
version = "1.1.25"
description = "Velta — Delta Chat client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "delta_web"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "delta-web"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde_json = "1"

# Android links the Delta Chat core in-process instead of spawning a sidecar.
[target.'cfg(target_os = "android")'.dependencies]
deltachat-jsonrpc = { path = "../../core/deltachat-jsonrpc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
futures-lite = "2"
yerpc = "0.6"
# resolve_content_uri: copy picked content:// attachments via ContentResolver.
jni = "0.21"


# Desktop-only plugins for deep-link handling (custom URI scheme) and single-instance forwarding.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
# panic = "unwind" so a panic during startup (e.g. in init_android_core or the
# tokio runtime) is caught by Tauri's setup() closure and surfaced via the
# `dc-sidecar-status` event instead of instantly killing the process. With
# panic = "abort" a single panic anywhere in the core or RPC session takes the
# whole app down with no diagnostic path, which on Android manifests as "the
# app won't start".
panic = "unwind"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
