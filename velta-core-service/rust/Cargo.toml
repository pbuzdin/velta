[package]
name = "rpc_core"
version = "1.0.0"
edition = "2021"
description = "Delta Chat core as an Android background-service backend (JNI)"

[lib]
name = "rpc_core"
crate-type = ["cdylib"]

[dependencies]
deltachat-jsonrpc = { git = "https://github.com/chatmail/core", tag = "v2.62.0" }
# For local development:
# deltachat-jsonrpc = { path = "../../core/deltachat-jsonrpc" }
yerpc = { version = "0.7", features = ["anyhow_expose"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
anyhow = "1"
serde_json = "1"
jni = "0.21"
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
