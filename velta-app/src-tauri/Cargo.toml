[package]
name = "velta-app"
version = "1.4.36"
description = "Velta — Delta Chat client"
edition = "2021"
rust-version = "1.89"
# src/bin/p2p-hub.rs is a second binary (debug helper, see [[bin]] below);
# without this key `cargo tauri dev` cannot decide what to run.
default-run = "velta-app"

[lib]
name = "velta_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "velta-app"
path = "src/main.rs"

# Headless Local chat debug hub. Behind a feature so release bundles never
# ship it: Tauri bundles every [[bin]] of the crate, and a universal macOS
# build (which lipo-merges only the main binary) fails on the missing hub.
# Run it with: cargo run --bin p2p-hub --features p2p-hub
[[bin]]
name = "p2p-hub"
path = "src/bin/p2p-hub.rs"
required-features = ["p2p-hub"]

[features]
p2p-hub = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Incoming-message notifications (system notification API per platform).
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
tokio-util = "0.7"
anyhow = "1"
rand = "0.8"
data-encoding = "2"
# fetch_page_title: best-effort <title> for the in-app browser bar.
ureq = "2"
socket2 = "0.5"
# Terminal QR rendering for the p2p-hub debug example.
qrcode = { version = "0.14", default-features = false }
# Local-only P2P chat (p2p.rs): relay-less iroh with mDNS re-discovery on the LAN.
iroh = { version = "0.35", default-features = false, features = ["discovery-local-network"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
sha1 = "0.10"

# Android links the Delta Chat core in-process instead of spawning a sidecar.
[target.'cfg(target_os = "android")'.dependencies]
deltachat-jsonrpc = { path = "../../core/deltachat-jsonrpc" }
futures-lite = "2"
yerpc = "0.7"
# resolve_content_uri: copy picked content:// attachments via ContentResolver.
jni = "0.21"


# Desktop-only plugins for deep-link handling (custom URI scheme) and single-instance forwarding.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-deep-link = "2"
# One-click self-update on desktop: updater downloads, signature-verifies
# and installs (NSIS installer on Windows, .app.tar.gz on macOS); process
# relaunches after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Windows-only: pulling this crate into macOS/Linux builds drags in the
# `windows` crates, which do not compile there.
[target.'cfg(windows)'.dependencies]
# Windows toasts with the conversation layout (three text lines + circular
# sender avatar); same crate the notification plugin uses on Windows.
tauri-winrt-notification = "0.7"

[profile.release]
# panic = "unwind" so a panic during startup (e.g. in init_android_core or the
# tokio runtime) is caught by Tauri's setup() closure and surfaced via the
# `dc-sidecar-status` event instead of instantly killing the process. With
# panic = "abort" a single panic anywhere in the core or RPC session takes the
# whole app down with no diagnostic path, which on Android manifests as "the
# app won't start".
panic = "unwind"
lto = true
codegen-units = 1
strip = true
opt-level = "s"
