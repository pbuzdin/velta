[package]
name = "velta-attachment"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Velta's versioned, seekable attachment encryption format"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
hex = "0.4"
hkdf = "0.12"
rand = "0.9"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

# This package is shared by the core and native shell workspaces.
[workspace]
