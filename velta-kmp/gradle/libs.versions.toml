# Version catalog for the KMP client (tracking issue #192).
# Gradle wrapper 8.14.3 + Kotlin 2.2.20 + compileSdk 36 mirror the proven
# combo of the Tauri gen Android project so both builds share a toolchain.

[versions]
agp = "8.13.0"
kotlin = "2.2.20"
composeMultiplatform = "1.9.0"
coroutines = "1.10.2"
serialization = "1.9.0"
unifiedpush = "3.3.4-rc1"
androidxBiometric = "1.1.0"
androidxFragment = "1.8.6"
zxing = "3.5.3"
camerax = "1.4.1"
androidxActivityCompose = "1.11.0"
androidxBrowser = "1.8.0"
# #507 measurement: baseline profiles + macrobenchmarks (manual runs, not CI).
baselineprofile = "1.4.1"
profileinstaller = "1.4.1"
macrobenchmark = "1.4.1"
uiautomator = "2.3.0"
androidxTestRunner = "1.6.2"
compileSdk = "36"
# 26: java.time (used for timestamp formatting) without desugaring.
minSdk = "26"
targetSdk = "36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "macrobenchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidTest = { id = "com.android.test", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
