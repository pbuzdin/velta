# Version catalog for the KMP client (tracking issue #192).
# Gradle wrapper 8.14.3 + Kotlin 2.2.20 + compileSdk 36 mirror the proven
# combo of the Tauri gen Android project so both builds share a toolchain.

[versions]
agp = "8.13.0"
kotlin = "2.2.20"
composeMultiplatform = "1.9.0"
coroutines = "1.10.2"
serialization = "1.9.0"
unifiedpush = "3.3.4-rc1"
androidxBiometric = "1.1.0"
zxing = "3.5.3"
camerax = "1.4.1"
androidxActivityCompose = "1.11.0"
compileSdk = "36"
# 26: java.time (used for timestamp formatting) without desugaring.
minSdk = "26"
targetSdk = "36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
