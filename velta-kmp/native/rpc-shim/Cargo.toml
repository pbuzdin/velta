[workspace]

[package]
name = "velta-rpc-shim"
version = "0.1.0"
edition = "2021"

# Size-tuned release profile (P5): the shim statically links the whole core
# — LTO + single codegen unit + symbol stripping took the per-ABI .so from
# ~80 MB (unstripped default release) to a fraction of that. panic stays
# unwind: an abort here takes the whole app process down with it.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
debug = false

# In-process deltachat core for the KMP Android client (issue #192 P1b, #357).
# Loads via System.loadLibrary("velta_rpc_shim"). One yerpc JSON-lines
# session over JNI — no listening port. Framing matches deltachat-rpc-server.
#
# Build (WSL, NDK exports per AGENTS §4.3.3):
#   cargo build --release --target aarch64-linux-android --target x86_64-linux-android
# Output: target/<triple>/release/libvelta_rpc_shim.so → jniLibs/<abi>/

[lib]
name = "velta_rpc_shim"
# cdylib: Android JNI (.so). rlib: the desktop sidecar bin (#424) links the
# same session code - one source, two artifacts.
crate-type = ["cdylib", "rlib"]

# Desktop sidecar (#424): replaces the deltachat-rpc-server externalBin.
[[bin]]
name = "velta-rpc-server"
path = "src/main.rs"

[dependencies]
deltachat-jsonrpc = { path = "../../../core/deltachat-jsonrpc" }
yerpc = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
data-encoding = "2"
getrandom = "0.2"
socket2 = "0.5"
# #259 step 2: the plaintext → SQLCipher migration opens account databases
# directly (same bundled SQLCipher the core links).
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
# Velta Loop (#332): LAN discovery only. The engine never dials a relay.
iroh = { version = "0.35", default-features = false, features = ["discovery-local-network"] }
# p2p media must ship plaintext: uploads copies are VLTA-encrypted with this
# device key (same as the desktop fix, #448/#450).
velta-attachment = { path = "../../../packages/attachment-crypto" }
# JNI is the Android transport only; the desktop bin speaks stdio (#424).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
