[workspace]

[package]
name = "velta-rpc-shim"
version = "0.1.0"
edition = "2021"

# Size-tuned release profile (P5): the shim statically links the whole core
# — LTO + single codegen unit + symbol stripping took the per-ABI .so from
# ~80 MB (unstripped default release) to a fraction of that. panic stays
# unwind: an abort here takes the whole app process down with it.
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"

# In-process deltachat core for the KMP Android client (issue #192 P1b).
# Loads via System.loadLibrary("velta_rpc_shim") and serves the deltachat
# JSON-RPC surface on a localhost TCP port — one yerpc session per
# connection, exactly the framing deltachat-rpc-server speaks on stdio.
# The KMP client connects with a plain socket transport; when this shim is
# eventually replaced by a proper foreground-service architecture, that
# contract stays.
#
# Build (WSL, NDK exports per AGENTS §4.3.3):
#   cargo build --release --target aarch64-linux-android --target x86_64-linux-android
# Output: target/<triple>/release/libvelta_rpc_shim.so → jniLibs/<abi>/

[lib]
name = "velta_rpc_shim"
crate-type = ["cdylib"]

[dependencies]
deltachat-jsonrpc = { path = "../../../core/deltachat-jsonrpc" }
yerpc = "0.7"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
anyhow = "1"
jni = "0.21"
